name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          for u in https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv https://www.mimit.gov.it/images/exportCSV/anagrafica_impianti_attivi.csv https://opendatacarburanti.mise.gov.it/ ; do
            curl -sS -m 200 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36" -o /tmp/f -w "$u %{http_code} %{size_download} %{time_total}\n" "$u"; head -c 300 /tmp/f; echo; done
