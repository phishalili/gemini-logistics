name: Përditëso çmimet e naftës

on:
  schedule:
    - cron: "17 6 * * 2"   # çdo të martë në mëngjes (buletini i BE-së del të hënën)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/update_prices.py
      - name: Ruaj nëse ka ndryshime
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Çmimet e naftës $(date +%F)"
          git push
