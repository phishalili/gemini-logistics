name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Offline copy and icons
        run: |
          W=android/app/src/main/assets/www; mkdir -p $W
          cp index.html sw.js manifest.json logo.png mark.png icon-192.png icon-512.png jspdf.min.js three.min.js $W/
          R=android/app/src/main/res
          mkdir -p $R/mipmap-xhdpi $R/mipmap-xxxhdpi
          cp icon-192.png $R/mipmap-xhdpi/ic_launcher.png
          cp icon-512.png $R/mipmap-xxxhdpi/ic_launcher.png
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/*.apk
