*{box-sizing:border-box}

body.client{padding-bottom:24px}

header .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;color:var(--acc);font-size:17px}
header .brand small{display:block;font-size:9px;letter-spacing:.14em;color:var(--mute);font-weight:700}
header img{height:34px;width:auto}
main{padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}

nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
h2{font-size:17px;margin:2px 0 10px;font-weight:800}
h3{font-size:12px;margin:16px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
label{display:block;font-size:12.5px;color:var(--mute);margin:9px 0 3px;font-weight:600}
input,select,textarea{width:100%;font:500 15px var(--f);padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.cmenu{position:fixed;inset:0;background:#0006;z-index:50;display:flex;align-items:flex-end;justify-content:center}.cm-box{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}.cm-btn{display:block;text-align:center;padding:14px;border-radius:12px;font-weight:700;font-size:16px;text-decoration:none;color:var(--ink);background:var(--bg);border:0}
a[href^="tel:"]{color:var(--acc);text-decoration:none;font-weight:600;white-space:nowrap}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:44px;text-align:left}input::-webkit-date-and-time-value{text-align:left;margin:0}
.btn{display:inline-block;border:0;border-radius:12px;padding:13px 16px;font:700 16px var(--f);background:var(--acc);color:var(--onacc);text-decoration:none;text-align:center;cursor:pointer}
.btn.ghost{background:var(--acc2);color:var(--acc)}

td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}td:last-child{text-align:right;white-space:nowrap;padding-left:8px;font-variant-numeric:tabular-nums}
.sug{position:relative}
.sug ul{position:absolute;left:0;right:0;top:100%;margin:2px 0 0;padding:0;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:4;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(10,20,60,.18)}
.sug li{padding:10px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}

.pill.road{background:#fff4cc;color:#8a6200}.pill.next{background:var(--acc2);color:var(--acc)}.pill.none{background:#fde8e8;color:#b42318}
.ost{border-left:5px solid var(--line);padding-left:10px!important;margin-left:-4px}.ost.none{border-left-color:#e5484d}.ost.next{border-left-color:#3b6fe0}.ost.road{border-left-color:#f0b400}.ost.done{border-left-color:#2fa36b}
.fchip{border:0;font:inherit;font-size:13.5px;font-weight:700;padding:7px 12px;cursor:pointer}.fchip.on{outline:2px solid currentColor;outline-offset:1px}
.seg{display:flex;gap:8px;margin:4px 0 10px}.seg button{flex:1;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 8px;font:700 15px var(--f);cursor:pointer;text-align:center}
.seg button small{display:block;font-weight:500;font-size:12px;color:var(--mute);margin-top:2px}.seg button.on{border-color:var(--acc);background:var(--acc2);color:var(--acc)}
.btn.big{font-size:17px;padding:14px}.btn.yellow{background:#f0b400;color:#1c2333}.btn.green{background:#2fa36b;color:#fff}
.stop{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.stop:last-child{border-bottom:0}
.num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-weight:800;font-size:13px}
.stop .grow{flex:1;min-width:0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0 2px}.bar i{display:block;height:100%;background:var(--acc)}
.bar.over i{background:var(--warn)}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;background:var(--bg)}
.item .top{display:flex;gap:8px;align-items:center;margin-top:8px}
label.chk{display:flex;gap:8px;align-items:center;margin:0;font-weight:500;font-size:14px;cursor:pointer}label.chk input{width:auto;margin:0}
.item .ihead{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-weight:600;min-height:32px}.item .ihead::-webkit-details-marker{display:none}
.item .ihead::after{content:"▾";color:var(--mute);font-size:14px;transition:transform .15s}.item:not([open]) .ihead::after{transform:rotate(-90deg)}
.item .inum{flex:0 0 24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:13px}
.item .ilab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.item .top select{flex:1}
.item .top input{width:70px;flex:0 0 70px}
.item .x{background:none;border:0;color:var(--mute);font-size:22px;line-height:1;padding:4px 6px;cursor:pointer}
.item .dims{display:flex;gap:6px;margin-top:6px}.item .dims.lab{margin:6px 0 -3px}.item .dims.lab span{flex:1;min-width:0;font-size:11px;color:var(--mute);font-weight:600;padding-left:2px}.item .dims>input{flex:1}.item .dims input{min-width:0;padding:8px;font-size:14px}
.totals{display:flex;gap:8px;margin-top:10px}.totals div{flex:1;background:var(--acc2);border-radius:10px;padding:8px;text-align:center}
.totals b{display:block;font-size:16px;color:var(--acc)}.totals span{font-size:11px;color:var(--mute);font-weight:600}
.hero{text-align:center;padding:18px 8px 6px}.hero img{width:170px;max-width:60%}
.hero p{margin:6px 0 0;color:var(--mute)}
[hidden]{display:none!important}
.p3d{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px;min-height:120px}
#toast{position:fixed;left:16px;right:16px;bottom:96px;background:var(--ink);color:var(--bg);padding:12px;border-radius:10px;text-align:center;z-index:9;font-weight:600}
</style>

<script>
"use strict";
/* ===================== CILËSIMET FILLESTARE ===================== */
const DEFAULTS = {

  vans:[

    {id:"B",name:"Sprinter B",lPer100:18,totalKg:7000,emptyKg:3100,payloadKg:3900,cargo:{w:2.10,l:4.20,h:2.30},trailer:{w:2.20,l:5.0,h:2.50}}
  ],
  diesel:{XK:1.78,RS:2.01,HR:1.97,SI:1.90,AT:1.96,DE:2.22,HU:1.92}, dieselAuto:true, dieselUpdated:"",

  fixedYear:[{name:"Sigurimi (200 € × 4)",eur:800},{name:"Vinjeta Austri",eur:90},{name:"Tunelet Austri",eur:77},{name:"Vinjeta Slloveni",eur:240}],

/* ===================== RUAJTJA ===================== */
const KEY="gemini.logistics.v1";
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return d}catch(e){}return null}
let DB=load()||{settings:structuredClone(DEFAULTS),orders:[],trips:[]};
DB.settings=Object.assign(structuredClone(DEFAULTS),DB.settings);
if(!DB.cars)DB.cars=[];DB.trips.forEach(t=>{if(!t.carIds)t.carIds=[]});
// ngarkesa = pesha max totale (7 t me rimorkio) − pesha bosh e furgonit dhe rimorkios
// 7000 kg = pesha totale (Sprinter + rimorkio + ngarkesa); ngarkesa = 7000 − pesha bosh
function fixPayload(){DB.settings.vans.forEach(v=>{if(v.totalKg===undefined)v.totalKg=7000;if(!DB.gross7t&&!(+v.emptyKg))v.emptyKg=3100;v.emptyKg=+v.emptyKg||0;v.payloadKg=Math.max(0,v.totalKg-v.emptyKg)});DB.gross7t=true}
fixPayload();
if(!DB.settings.presetsV2){DB.settings.presets.forEach(p=>{if(p.name==="Kuzhinë (për metër)")p.name="Kuzhinë (sasia = metra, në elemente)";if(p.rate===undefined)p.rate=p.name.startsWith("Kuzhinë")?250:0;const d=DEFAULTS.presets.find(x=>x.name===p.name);if(d){if(d.noTop)p.noTop=true;if(d.up)p.up=true}if(/^(Divan|Kolltuk|Frigorifer)/.test(p.name))p.noTop=true;if(/^(Frigorifer|Lavatri)/.test(p.name))p.up=true;if(p.name.startsWith("Kuzhinë")&&p.perM===undefined){p.perM=true;p.name="Kuzhinë (shkruaj gjatësinë në cm)"}});
DEFAULTS.presets.filter(d=>d.app).forEach(d=>{if(!DB.settings.presets.some(p=>p.name===d.name))DB.settings.presets.push(structuredClone(d))});DB.settings.presets.forEach(p=>{if(p.name==="Frigorifer")p.app=true});DB.settings.presetsV2=true}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast("Nuk u ruajt në këtë pajisje")}if(window.__syncPush)window.__syncPush()}
const S=()=>DB.settings;
const uid=()=>Math.random().toString(36).slice(2,9);
const eur=n=>(Math.round(n*100)/100).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const km=n=>Math.round(n).toLocaleString("de-DE")+" km";
const num1=n=>(Math.round(n*10)/10).toLocaleString("de-DE");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
function toast(m){const el=$("#toast");el.textContent=m;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,2500)}
function twoTap(btn){if(btn.dataset.armed)return true;btn.dataset.armed=1;const o=btn.textContent;btn.textContent="Shtyp përsëri për ta konfirmuar";setTimeout(()=>{delete btn.dataset.armed;btn.textContent=o},3000);return false}

async function searchOnline(q){

function avgVan(){const V=S().vans,a=k=>V.reduce((x,v)=>x+(+v[k]||0),0)/V.length,ad=(p,k)=>V.reduce((x,v)=>x+v[p][k],0)/V.length;

// Çmimi i vendit: nëse shoferët kanë mbushur në 7 ditët e fundit, përdoret mesatarja e asaj që kanë paguar
function paidAvg(c,days=7){const lim=Date.now()-days*864e5,l=(DB.fills||[]).filter(f=>f.c===c&&+f.price>0&&new Date(f.date).getTime()>=lim);

function perKm(v){return v.lPer100/100*dieselPrice()+S().wearPerKm}
function fixedPerTrip(){const s=S();return s.fixedYear.reduce((a,b)=>a+(+b.eur||0),0)/Math.max(1,s.tripsPerYear)}
function tripCostBreakdown(v,kmTotal,tr){

  const fl=tr?(DB.fills||[]).filter(f=>f.tripId===tr.id&&+f.price>0&&+f.liters>0):[],fL=fl.reduce((a,f)=>a+ +f.liters,0);
  const dp=fL?fl.reduce((a,f)=>a+f.price*f.liters,0)/fL:dieselPrice();
  const rows=[
    ["Nafta ("+Math.round(L)+" L × "+eur(dp)+(fL?", çmimi i paguar":"")+")",L*dp],
    ["Konsumimi & servisi ("+km(kmTotal)+" × "+eur(s.wearPerKm)+")",kmTotal*s.wearPerKm],
    ["Autostradat / taksat",s.tollsPerTrip.reduce((a,b)=>a+(+b.eur||0),0)],

    if(ex.some(e=>EXPG[e.cat]==="toll"))rows[2]=["Autostradat / tunelet (të shënuara)",sumG("toll")];
    const oth=ex.filter(e=>!EXPG[e.cat]);if(oth.length)rows.push(["Shpenzime të tjera të shënuara",oth.reduce((a,e)=>a+(+e.eur||0),0)])}

const EXPCATS=[["ushqim","Ushqim"],["fjetje","Fjetje"],["autostrade","Autostradë / tunel"],["parking","Parking"],["servis","Servis / larje"],["gjobe","Gjobë"],["tjeter","Të tjera"]];
const EXPG={ushqim:"drv",fjetje:"drv",autostrade:"toll"};
const tripExp=tr=>Array.isArray(tr&&tr.exp)?tr.exp:[];

// Dogana sipas vendit të destinacionit (Cilësimet). Porositë e vjetra pa vatRate mbajnë normën e vjetër (18%).
const dutyRate=addr=>+((S().duty||{})[countryOf(addr)]||0);
const recRate=x=>x.vatRate!=null?+x.vatRate:(+S().vat||0);
const netOf=(gross,on=true,rate=+S().vat||0)=>(+gross||0)/(on?1+rate/100:1);
const netRec=x=>netOf(x.price,x.vatOn!==false,recRate(x));   // porosia/vetura: çmimi pa doganë
function priceFromCost(c){const s=S();return Math.max(s.minPrice,Math.ceil(c*(1+s.margin/100)/5)*5)}
// Mallrat me çmim fiks (p.sh. kuzhina 250 €/m) + mallrat e llogaritur sipas hapësirës/peshës + shtesa për adresën
const rateOf=it=>it.preset==="x"?0:(+S().presets[it.preset]?.rate||0);
// Qyteti kryesor = qyteti i porosisë më të madhe që pret (s'ka qytet fiks). Rruga shtesë llogaritet nga rruga Kosovë ⇄ ai qytet.
const sizeOf=g=>{const v=avgVan();return Math.max((g.kg||0)/v.payloadKg,(g.m3||0)/vanVol(v))};

  if(big&&sizeOf(orderGoods(big))>sizeOf(g))return {addr:big.addr,why:"porosia më e madhe që pret: "+(big.customer||cityOf(big.addr)),self:false};
  return {addr,why:"kjo është porosia më e madhe",self:true};

async function quote(g,addr,items=[],opt={}){ // çmimi kthehet ME doganë; net = pa doganë
  const s=S(),v=avgVan(),mk=1+s.margin/100,hub=mainHub(g,addr,opt.selfId);
  const M=await distMatrix([s.base,hub.addr,addr]);
  const lineKm=M[0][1]+M[1][0];
  const detourKm=Math.max(0,M[1][2]+M[2][0]-M[1][0]);
  const trip=tripCostBreakdown(v,lineKm);
  const share=shareOf(g,v), lineShare=Math.min(1,share/(s.loadFactor/100));
  const detourCost=detourKm*perKm(v);

  const fixed=items.filter(i=>(+i.qty)&&rateOf(i)>0), calc=items.filter(i=>(+i.qty)&&!(rateOf(i)>0));
  const fixedSum=fixed.reduce((a,i)=>a+units(i)*rateOf(i),0);

// Rruga: nga nisja → ndalesat (radha më e mirë) → destinacioni → kthim në shtëpi. Pa nisje/destinacion: rreth nga shtëpia.
function bestPath(M){ // 0 = nisja, n-1 = destinacioni (fiks)
  const n=M.length;if(n<=2)return {order:[],len:n===2?M[0][1]:0};
  let tour=[0],left=new Set([...Array(n-1).keys()].slice(1));
  while(left.size){const last=tour[tour.length-1];let b=null,bd=1e18;for(const j of left)if(M[last][j]<bd){bd=M[last][j];b=j}tour.push(b);left.delete(b)}
  tour.push(n-1);
  const len=tr=>tr.reduce((s,v,i)=>i?s+M[tr[i-1]][v]:0,0);
  let improved=true;
  while(improved){improved=false;
    for(let i=1;i<tour.length-2;i++)for(let k=i+1;k<tour.length-1;k++){
      const nt=[...tour.slice(0,i),...tour.slice(i,k+1).reverse(),...tour.slice(k+1)];
      if(len(nt)+1e-9<len(tour)){tour=nt;improved=true}}}
  return {order:tour.slice(1,-1),len:len(tour)};
}
function tripCars(trip){return (trip.carIds||[]).map(id=>DB.cars.find(c=>c.id===id)).filter(Boolean)}
// Vajtja: nisja → porositë → destinacioni. Kthimi: destinacioni (ose ndalesa e fundit) → veturat → baza.
async function routeOf(trip,orders,cars=tripCars(trip)){
  const s=S();let order,outLen,E,real=true;
  if(trip.start&&trip.dest){
    const M=await distMatrix([trip.start,...orders.map(o=>o.addr),trip.dest]);real=M.real;
    const bp=bestPath(M);order=bp.order.map(i=>orders[i-1]);outLen=bp.len;E=trip.dest;
  }else{
    const M=await distMatrix([s.base,...orders.map(o=>o.addr)]),b=bestOrder(M);real=M.real;
    order=b.order.map(i=>orders[i-1]);
    if(order.length){const li=orders.indexOf(order[order.length-1])+1;outLen=b.len-M[li][0];E=order[order.length-1].addr}else{outLen=0;E=s.base}
  }

  return {order,cars:bp2.order.map(i=>cars[i-1]),len:outLen+bp2.len,back:bp2.len,real:real&&R.real,end:E};
}
async function planTrip(trip){

  const revenue=ordersIn+carsIn+(+trip.returnIncome||0);
  return {v,orders,stops:r.order,carStops:r.cars,carsIn,ordersIn,vatAmt,docs,back:r.back,kmTotal:r.len,costs,kg,m3,revenue,profit:revenue-costs.total-orders.length*s.handling-docs,real:r.real};

// Rruga e vërtetë (OSRM) si listë pikash; pa internet: vija të drejta mes ndalesave
const geomCache={};
async function routeGeom(pts){
  pts=pts.filter(p=>p&&p.lat);const key=pts.map(p=>p.lat.toFixed(3)+","+p.lng.toFixed(3)).join("|");
  if(geomCache[key])return geomCache[key];
  try{const r=await fetch("https://router.project-osrm.org/route/v1/driving/"+pts.map(p=>p.lng+","+p.lat).join(";")+"?overview=full&geometries=geojson");
    const j=await r.json();if(j.code!=="Ok")throw 0;
    const c=j.routes[0].geometry.coordinates,out=[];let last=null;
    for(const [lng,lat] of c){const q={lat,lng};if(!last||hav(last,q)>2){out.push(q);last=q}}
    out.push({lat:c[c.length-1][1],lng:c[c.length-1][0]});
    return geomCache[key]={line:out,real:true,km:j.routes[0].distance/1000};
  }catch(e){const out=[];for(let i=0;i<pts.length;i++){if(i){const a=pts[i-1],b=pts[i],n=Math.max(1,Math.ceil(hav(a,b)/5));for(let k=1;k<=n;k++)out.push({lat:a.lat+(b.lat-a.lat)*k/n,lng:a.lng+(b.lng-a.lng)*k/n})}else out.push(pts[0])}
    return {line:out,real:false,km:0}}
}
// Pikat afër rrugës (≤ maxKm), me kilometrin ku ndodhen
function stationsAlong(line,maxKm=10){
  const all=STN?.stations||[];if(!all.length||!line.length)return [];
  const cum=[0];for(let i=1;i<line.length;i++)cum.push(cum[i-1]+hav(line[i-1],line[i]));
  let la0=90,la1=-90,lo0=180,lo1=-180;line.forEach(p=>{la0=Math.min(la0,p.lat);la1=Math.max(la1,p.lat);lo0=Math.min(lo0,p.lng);lo1=Math.max(lo1,p.lng)});
  const out=[];
  for(const st of all){
    if(st.lat<la0-.2||st.lat>la1+.2||st.lng<lo0-.3||st.lng>lo1+.3)continue;
    const cl=Math.cos(st.lat*Math.PI/180);let best=1e9,at=0;
    for(let i=0;i<line.length;i++){const dx=(line[i].lng-st.lng)*111*cl,dy=(line[i].lat-st.lat)*111;const d=dx*dx+dy*dy;if(d<best){best=d;at=i}}
    const d=Math.sqrt(best);if(d<=(st.c==="DE"?25:maxKm))out.push({...st,off:d,at:cum[at]});
  }
  return out;
}

/* ===================== NGARKIMI 3D ===================== */
// Copat (cm). Kuzhina ndahet në elemente; çdo copë tjetër = sasia × L×W×H.
const PCOL=["#3b6fe0","#e0883b","#2fa36b","#c4469a","#d4b72c","#5bb7d6","#8a5cd8","#d65b5b","#6f8a2f","#b08060"];
function piecesFromItems(items,tag="",color0=0){
  const P=S().presets,out=[];
  items.forEach((it,j)=>{const q=+it.qty||0,L=+it.l||0,W=+it.w||0,H=+it.h||0;if(!q||!L||!W||!H)return;const color=tag?color0:j;
    const name=it.preset==="x"?"Mall":(P[it.preset]?.name||"Mall").replace(/\s*\(.*\)/,"");
    const kgEach=+it.kg>0?+it.kg:L*W*H/1e6*S().densityKgM3,pr=it.preset==="x"?{}:(P[it.preset]||{}),fl={noTop:!!pr.noTop,up:!!pr.up};
    if(perM(it)){const seg=Math.min(100,+P[it.preset].l||100);let total=units(it)*100,n=1;
      while(total>0.5){const len=Math.min(seg,total);out.push({l:len,w:W,h:H,kg:kgEach*len/100,name:name+" "+n++,tag,color,elem:true});total-=len}}
    else for(let k=0;k<q;k++)out.push({l:L,w:W,h:H,kg:kgEach,name:q>1?`${name} ${k+1}`:name,tag,color,...fl})});
  return out;
}
// Hapësirat: rimorkioja dhe furgoni (cm). Mbushja nga përpara (x=0) drejt derës.
function spacesOf(v){return [{key:"trailer",name:"Rimorkioja",L:v.trailer.l*100,W:v.trailer.w*100,H:v.trailer.h*100},{key:"van",name:"Furgoni",L:v.cargo.l*100,W:v.cargo.w*100,H:v.cargo.h*100}]}
function packPieces(pieces,v,opt={}){
  const spaces=spacesOf(v).map(s=>({...s,boxes:[],eps:[{x:0,y:0,z:0}]}));
  const unplaced=[];
  const ov=(a0,a1,b0,b1)=>Math.min(a1,b1)-Math.max(a0,b0);
  for(const p of pieces){
    const oris=[[p.l,p.w,p.h],[p.w,p.l,p.h]];
    if(opt.tip&&!p.elem&&!p.up)oris.push([p.l,p.h,p.w],[p.h,p.l,p.w],[p.w,p.h,p.l],[p.h,p.w,p.l]);
    let best=null;
    for(const sp of spaces){
      for(const e of sp.eps)for(const [l,w,h] of oris){
        if(e.x+l>sp.L+0.01||e.y+w>sp.W+0.01||e.z+h>sp.H+0.01)continue;
        let hit=false;for(const b of sp.boxes){if(ov(e.x,e.x+l,b.x,b.x+b.l)>0.01&&ov(e.y,e.y+w,b.y,b.y+b.w)>0.01&&ov(e.z,e.z+h,b.z,b.z+b.h)>0.01){hit=true;break}}
        if(hit)continue;
        if(e.z>0.01){let sup=0;for(const b of sp.boxes){if(Math.abs(b.z+b.h-e.z)<0.5){const a=ov(e.x,e.x+l,b.x,b.x+b.l),c=ov(e.y,e.y+w,b.y,b.y+b.w);if(a>0&&c>0)sup+=a*c}}
          if(sup<0.75*l*w)continue;
          // asgjë mbi divane, kolltukë, frigoriferë
          if(sp.boxes.some(b=>b.noTop&&Math.abs(b.z+b.h-e.z)<0.5&&ov(e.x,e.x+l,b.x,b.x+b.l)>0&&ov(e.y,e.y+w,b.y,b.y+b.w)>0))continue;
          // mos vër të rëndën mbi të lehtën
          if(sp.boxes.some(b=>Math.abs(b.z+b.h-e.z)<0.5&&ov(e.x,e.x+l,b.x,b.x+b.l)>0&&ov(e.y,e.y+w,b.y,b.y+b.w)>0&&b.kg<p.kg*0.5))continue}
        const score=(sp.key==="trailer"?0:1e9)+e.x*1e4+e.z*10+e.y; // rimorkio e para, pastaj përpara, poshtë, majtas
        if(!best||score<best.score)best={sp,x:e.x,y:e.y,z:e.z,l,w,h,score}}}
    if(!best){unplaced.push(p);continue}
    const b={...p,x:best.x,y:best.y,z:best.z,l:best.l,w:best.w,h:best.h,step:0},sp=best.sp;
    sp.boxes.push(b);
    sp.eps=sp.eps.filter(e=>!(e.x>=b.x-0.01&&e.x<b.x+b.l-0.01&&e.y>=b.y-0.01&&e.y<b.y+b.w-0.01&&e.z>=b.z-0.01&&e.z<b.z+b.h-0.01));
    for(const e of [{x:b.x+b.l,y:b.y,z:b.z},{x:b.x,y:b.y+b.w,z:b.z},{x:b.x,y:b.y,z:b.z+b.h},{x:b.x+b.l,y:0,z:b.z},{x:b.x,y:0,z:b.z+b.h},{x:0,y:b.y+b.w,z:b.z}])
      if(!sp.eps.some(f=>Math.abs(f.x-e.x)<0.01&&Math.abs(f.y-e.y)<0.01&&Math.abs(f.z-e.z)<0.01))sp.eps.push(e);
  }
  let n=1;for(const sp of spaces)for(const b of sp.boxes)b.step=n++;
  return {spaces,unplaced};
}
function posTxt(b,sp){const third=sp.L/3,c=b.x+b.l/2,m=b.y+b.w/2;

function carBody(c){const t=" "+String(c.model||"").toLowerCase()+" ";
  if(/ (caddy|touran|sharan|vito|viano|transit|berlingo|partner|kangoo|zafira|multivan|t5|t6|vivaro|trafic|doblo|scenic|espace|b-max|c-max|s-max|galaxy|alhambra|v-klasse|v class) /.test(t)||(c.h||0)>=175)return "van";
  if(/ (tiguan|touareg|x1|x3|x5|x6|q3|q5|q7|ml|gle|glc|gla|rav4|sportage|tucson|qashqai|kuga|sorento|santa fe|duster|kodiaq|karoq|ateca|xc60|xc90|cr-v|cx-5|t-roc|captur|3008|5008|evoque|range|discovery|outlander|juke|x-trail|vitara) /.test(t)||(c.h||0)>=158)return "suv";
  if(/ (golf|polo|corsa|clio|fiesta|focus|yaris|i20|i30|ceed|astra|fabia|ibiza|leon|a3|1er|a-klasse|a class|208|308|punto|micro|up|c3|megane|auris|civic|swift) /.test(t)||(c.l||0)<=430)return "hatch";
  return "sedan"}
const PROFILES={ // [x, y] si pjesë e gjatësisë/lartësisë; përpara = x 0 (nga furgoni)
  sedan:[[0,.30],[0,.52],[.04,.60],[.30,.64],[.43,.97],[.68,1],[.84,.68],[1,.64],[1,.30]],
  hatch:[[0,.30],[0,.52],[.04,.60],[.27,.64],[.42,.97],[.86,1],[.98,.85],[1,.55],[1,.30]],
  suv:[[0,.30],[0,.58],[.04,.66],[.25,.70],[.38,.98],[.90,1],[.99,.92],[1,.55],[1,.30]],
  van:[[0,.28],[0,.55],[.06,.62],[.16,.68],[.28,.98],[.95,1],[1,.95],[1,.28]]};
const WINDOWS={sedan:[[.30,.66],[.43,.95],[.68,.98],[.83,.69]],hatch:[[.27,.66],[.42,.95],[.86,.98],[.97,.84]],suv:[[.25,.72],[.38,.96],[.90,.98],[.98,.91]],van:[[.16,.70],[.28,.96],[.95,.98],[.99,.93],[.99,.70]]};
function carMesh(T,c,L,W,H,i){
  const g=new T.Group(),type=carBody(c),clear=0.12,bodyH=H-clear;
  const shape=pts=>{const sh=new T.Shape();pts.forEach(([x,y],k)=>k?sh.lineTo(x*L,clear+y*bodyH-0.3*bodyH*0):sh.moveTo(x*L,clear+y*bodyH));return sh};
  const prof=PROFILES[type].map(([x,y])=>[x,(y-.30)/.70]);
  const ext=(pts,depth,mat,z)=>{const geo=new T.ExtrudeGeometry(shape(pts),{depth,bevelEnabled:true,bevelThickness:0.03,bevelSize:0.03,bevelSegments:2});const me=new T.Mesh(geo,mat);me.position.z=z;g.add(me);return me};
  const col=[0xc62828,0x1565c0,0x2e7d32,0x6a1b9a][i%4];
  ext(prof,W-0.06,new T.MeshLambertMaterial({color:col}),0.03);
  ext(WINDOWS[type].map(([x,y])=>[x,(y-.30)/.70]),W-0.02,new T.MeshLambertMaterial({color:0x1b2533,transparent:true,opacity:0.85}),0.01);
  const wr=Math.min(0.33,H*0.22);
  for(const wx of [0.18*L,0.82*L])for(const wz of [0.02,W-0.02]){const wh=new T.Mesh(new T.CylinderGeometry(wr,wr,0.2,18),new T.MeshLambertMaterial({color:0x222222}));wh.rotation.x=Math.PI/2;wh.position.set(wx,wr,wz);g.add(wh)}
  return g}

async function fitsOnTrips(o){
  const open=DB.trips.filter(tr=>tr.status!=="done");if(!open.length)return "";

  for(const tr of open){const p=await planTrip(tr),v=p.v,ex=await extraKm(tr,o);
    rows.push({tr,ex,ok:p.kg+o.kg<=v.payloadKg&&p.m3+o.m3<=vanVol(v),cost:ex*perKm(v)})}
  rows.sort((a,b)=>(b.ok-a.ok)||(a.ex-b.ex));

}

const PDF={lib:null,logo:null,loading:null};
function preloadPdf(){
  if(PDF.loading)return PDF.loading;
  PDF.loading=(async()=>{
    if(!window.jspdf)await new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="jspdf.min.js";sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
    PDF.lib=window.jspdf.jsPDF;
    try{const b=await (await fetch("logo.png")).blob();PDF.logo=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)})}catch(e){PDF.logo=null}
  })().catch(e=>{PDF.loading=null;throw e});
  return PDF.loading;
}

async function shareOfferPdf(o,btn){
  const old=btn?.textContent;if(btn){btn.disabled=true;btn.textContent="Duke krijuar PDF…"}
  try{
    if(!PDF.lib)await preloadPdf();
    const doc=buildOfferPdf(o),blob=doc.output("blob");
    const name=("Oferta-Gemini-"+(o.customer||"klient")).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w-]+/g,"-").replace(/-+/g,"-")+"-"+offerNo(o).slice(3)+".pdf";
    const file=new File([blob],name,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:"Oferta e transportit"});return}catch(e){if(e.name==="AbortError")return}
    }
    const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),60000);toast("PDF u ruajt në telefon");
  }catch(e){toast("PDF nuk u krijua: "+(e.message||"pa internet?"))}
  finally{if(btn){btn.disabled=false;btn.textContent=old}}
}

let ORD_F=null;
function ordFilter(){if(ORD_F==null){try{ORD_F=localStorage.getItem("gemini.ordF")||"all"}catch(e){ORD_F="all"}}return ORD_F}
// Ngjyra e porosisë: e kuqe = pa udhëtim, blu = në udhëtimin e radhës, e verdhë = në rrugë, jeshile = dorëzuar
function orderState(o){if(o.status==="delivered")return {k:"done",t:"Dorëzuar"};
  const t=o.tripId&&DB.trips.find(x=>x.id===o.tripId);
  if(t&&t.status==="onroad")return {k:"road",t:"Në rrugë"+(t.name?" · "+t.name:"")};
  if(t&&t.status!=="done")return {k:"next",t:"Udhëtimi: "+tripLabel(t.id)};
  return {k:"none",t:"Pa udhëtim"}}
// A është porosia në një udhëtim që ende s'ka përfunduar?
function onTrip(o){const t=o.tripId&&DB.trips.find(x=>x.id===o.tripId);return !!t&&t.status!=="done"}
// "Rekomandohet": për çdo porosi që pret, udhëtimi i ardhshëm ku hyn me më pak rrugë shtesë (dhe ka vend)

  for(const t of trips){
    const v=vanById(t.van),os=t.orderIds.map(id=>DB.orders.find(o=>o.id===id)).filter(Boolean);
    const pts=[t.start||s.base,...os.map(o=>o.addr),t.dest||mainOrderOf(os)?.addr||s.base].filter(a=>a&&a.lat),n=pts.length;

      if(ex<=lim&&kg+g.kg<=v.payloadKg&&m3+g.m3<=vanVol(v)&&(!best[o.id]||ex<best[o.id].ex))best[o.id]={t,ex}});

// Plani automatik: radha më e mirë e dorëzimit + radha e ngarkimit (e fundit ngarkohet e para)
async function renderPlan(waiting){
  const s=S(),M=await distMatrix([s.base,...waiting.map(o=>o.addr)]),best=bestOrder(M);
  const route=best.order.map(i=>waiting[i-1]);
  const v=S().vans.reduce((a,b)=>vanVol(b)>vanVol(a)?b:a);
  let kg=0,m3=0;const take=[],later=[];
  for(const o of route){const g=orderGoods(o);if(kg+g.kg<=v.payloadKg&&m3+g.m3<=vanVol(v)){take.push(o);kg+=g.kg;m3+=g.m3}else later.push(o)}
  const legs=[];let prev=0;for(const i of best.order){legs.push(M[prev][i]);prev=i}
  if(TAB!=="orders"||VIEW||!$("#plan"))return;
  $("#plan").innerHTML=`<h2>Plani për porositë që presin</h2>
    <p class="mute">${take.length} porosi · ${Math.round(kg)} kg · ${num1(m3)} m³ · ${km(best.len)} vajtje-ardhje${M.real?"":" (përafërsisht)"}</p>
    <h3>1. Radha e dorëzimit</h3>
    ${take.map((o,i)=>`<div class="stop" style="cursor:default"><div class="num">${i+1}</div><div class="grow"><b>${esc(cityOf(o.addr))}</b> · ${esc(o.customer||"")}<br><span class="mute">${esc(o.items?itemsSummary(o.items):o.what||"")} · +${km(legs[route.indexOf(o)])}</span></div><a class="btn ghost small" href="${navUrl(o.addr)}" target="_blank" rel="noopener">Harta</a></div>`).join("")}
    <h3>2. Radha e ngarkimit në Kosovë</h3>
    <p class="mute" style="margin:0 0 6px">Ngarko së pari atë që dorëzohet e fundit (në fund të rimorkios), kështu e para del e para.</p>
    <ol style="margin:0;padding-left:20px;font-size:14px">${[...take].reverse().map(o=>`<li><b>${esc(o.customer||"")}</b> (${esc(cityOf(o.addr))}): ${esc(o.items?itemsSummary(o.items):o.what||"")}</li>`).join("")}</ol>
    ${later.length?`<p><span class="pill warn">Nuk hyjnë në një furgon: ${later.map(o=>esc(cityOf(o.addr))).join(", ")}. Lëri për udhëtimin tjetër.</span></p>`:""}
    <button class="btn full" id="mkTrip">Krijo udhëtim me këto ${take.length} porosi</button>`;
  $("#mkTrip").onclick=()=>{const tr={id:uid(),date:new Date(Date.now()+864e5).toISOString().slice(0,10),name:"",van:v.id,orderIds:take.map(o=>o.id),carIds:[],status:"planned",returnIncome:0};
    take.forEach(o=>o.tripId=tr.id);DB.trips.unshift(tr);save();toast("Udhëtimi u krijua. Ndrysho datën nëse duhet.");setTab("trips",tr.id)};
}

const CARVARS=(()=>{const V={};CARVARIANTS.split("\n").forEach(l=>{const i=l.indexOf("=");V[l.slice(0,i)]=l.slice(i+1).split(",").map(x=>{const [t,d]=x.split(":");return {t:t.trim(),d:+d||0}})});
  const out=[];CARSPECS.forEach(c=>{const vs=V[c.n];if(!vs){out.push({...c,lab:c.d,v:""});return}
    const brand=c.n.split(" ")[0]==="Land"?"Land Rover":c.n.split(" ")[0];
    vs.forEach(x=>{const own=/^\d{3}[a-z]/.test(x.t)||/^[A-Z]{1,3}\d{2,3}/.test(x.t);
      out.push({...c,kg:c.kg+x.d,lab:own?brand+" "+x.t:c.d+" "+x.t,v:x.t})})});
  return out})();
function carSuggest(q){const raw=norm(q).split(/[ ,]+/).filter(Boolean);if(!raw.length||norm(q).trim().length<2)return [];
  const tk=raw.map(t=>t.replace(/^([a-z]{0,3}\d{3})[a-z]{1,3}$/,"$1"));
  return CARVARS.filter(c=>{const words=norm(c.lab+" "+c.n+" "+(BRANDSYN[c.n.split(" ")[0]]||"")+" "+c.a.join(" ")+" "+c.v.replace(/^([A-Za-z]{0,3}\d{3})[a-z]{1,3}\b/,"$1 $&")).split(/[ ,/()-]+/);
    return tk.every((t,i)=>{const r=raw[i];
      // kodi i variantit (c220, 320d, a180): duhet të përputhet me variantin ose me emrin e modelit, jo me gjithë serinë
      if(/^[a-z]{0,3}\d{3}[a-z]{0,3}$/.test(r)&&!/^w\d{3}$/.test(r)){const v=norm(c.v).replace(/\s+/g,"");
        return v.startsWith(r)||v.replace(/^[a-z]+/,"").startsWith(r)||norm(c.d).split(/[ ,/()-]+/).some(w=>w.startsWith(r))}
      return words.some(w=>w.startsWith(t)||w.startsWith(r))})})
    .map((c,i)=>{const lw=norm(c.lab+" "+c.d).split(/[ ,/()-]+/);return {c,i,sc:tk.reduce((n,t,j)=>n+(lw.some(w=>w===t||w===raw[j])?2:lw.some(w=>w.startsWith(t)||w.startsWith(raw[j]))?1:0),0)}})
    .sort((a,b)=>b.sc-a.sc||b.c.y1-a.c.y1||a.i-b.i).map(x=>x.c).slice(0,60)}
// Gjen veturën nga emri dhe viti. Kthen të dhënat ose null.
function carLookup(model,year){
  const t=" "+String(model||"").toLowerCase().replace(/[^a-z0-9äöüë\- ]/g," ").replace(/\b([a-z]{0,3}\d{3})[a-z]{1,3}\b/g,"$1").replace(/\s+/g," ")+" ";if(t.trim().length<2)return null;
  const y=+year||+((String(model).match(/\b(19[89]\d|20[0-3]\d)\b/)||[])[1])||0;
  let best=null,bs=0;
  for(const c of CARSPECS){let sc=0;for(const a of c.a)if(t.includes(" "+a+" "))sc=Math.max(sc,a.length+(/\d|[ivx]$/.test(a)&&a.includes(" ")||/^[a-z]\d+$/.test(a)&&a.length>2?20:0));
    if(!sc)continue;if(y)sc+=y>=c.y1&&y<=c.y2?50:-Math.min(40,Math.min(Math.abs(y-c.y1),Math.abs(y-c.y2)));
    if(sc>bs){bs=sc;best=c}}
  return best;
}
// A hyn vetura në rimorkio të furgonit (gjatësi, gjerësi, peshë)?
function carFit(c,v){
  if(!c||!c.l)return {ok:true,txt:""};
  const L=v.trailer.l*100,W=v.trailer.w*100;const bad=[];
  if(c.l>L)bad.push("e gjatë "+num1(c.l/100)+" m > "+num1(v.trailer.l)+" m");
  if(c.w>W)bad.push("e gjerë");
  if(c.h&&c.h>v.trailer.h*100)bad.push("e lartë");
  if(c.kg&&c.kg>v.payloadKg)bad.push("e rëndë");
  return {ok:!bad.length,txt:bad.length?"Nuk hyn në "+v.name+": "+bad.join(", "):"Hyn në rimorkion e "+v.name};
}
// Çmimi i veturës në kthim: bazë + €/km × km (nga marrja deri në Kosovë), +% për vetura të rënda, minimumi, rrumbullakuar lart në 5 €
async function carQuote(c){ // c.vatOn, c.docs
  const s=S();if(!c.from)return null;
  const M=await distMatrix([c.from,s.base]);const kmH=M[0][1];
  let p=s.carBase+s.carPerKm*kmH,heavy=false;
  if(+c.kg>s.carHeavyKg){p*=1+s.carHeavyPct/100;heavy=true}
  const rate=dutyRate(c.from),vr=c.vatOn===false?0:rate/100,docs=+c.docs||0;
  const net=Math.max(s.carMin,p)+docs,price=Math.ceil(net*(1+vr)/5)*5;
  const cost=kmH*perKm(avgVan())*0.5+s.handling+docs;  // gjysma e kostos së kthimit (rruga bëhet gjithsesi) + ngarkimi
  return {km:kmH,price,net:price/(1+vr),docs,vatOn:c.vatOn!==false,rate,heavy,cost,real:M.real};
}

}

    if(o.full){o.fullDesc=$("#f-fdesc").value.trim();o.what="Transport i plotë"+(o.fullDesc?": "+o.fullDesc:"");delete o.items;o.m3=+vanVol(avgVan()).toFixed(1);o.kg=0}

/* ===================== UDHËTIMET ===================== */
const cityOf=a=>{const parts=(a?.label||"").split(",").map(x=>x.trim());return (parts.find(x=>/\d{4,5}\s+\D/.test(x))||parts[1]||parts[0]||"").replace(/^\d{4,5}\s+/,"").replace(" (qendra)","")};
const DITE=["E diel","E hënë","E martë","E mërkurë","E enjte","E premte","E shtunë"],MUAJ=["janar","shkurt","mars","prill","maj","qershor","korrik","gusht","shtator","tetor","nëntor","dhjetor"];
const dateTxt=d=>{if(!d)return "Pa datë";const x=new Date(d+"T12:00");return DITE[x.getDay()]+", "+x.getDate()+" "+MUAJ[x.getMonth()]+" "+x.getFullYear()};
function itemLines(o){const P=S().presets;return (o.items||[]).filter(i=>i.qty).map(i=>`<li>${i.qty} × ${esc(i.preset==="x"?"Mall":P[i.preset]?.name||"Mall")} <span class="mute">(${i.l}×${i.w}×${i.h} cm${+i.kg?", "+i.kg+" kg/copë":""})</span></li>`).join("")}
let newTripSel=null,ntf=null;
const todayISO=()=>new Date().toISOString().slice(0,10);
const isPast=t=>t.status==="done"||(t.date&&t.date<todayISO());
function tripRow(tr){const os=tr.orderIds.map(id=>DB.orders.find(o=>o.id===id)).filter(Boolean);const cities=[...new Set(os.map(o=>cityOf(o.addr)))];
  const title=tr.start&&tr.dest?cityOf(tr.start)+" → "+cityOf(tr.dest):(cities[cities.length-1]||"Udhëtim");const nc=(tr.carIds||[]).length;
  return `<div class="stop" onclick="setTab('trips','${tr.id}')"><div class="grow"><b>${esc(title)}</b> ${tr.status==="done"?`<span class="pill good">përfunduar</span>`:tr.status==="onroad"?`<span class="pill road">në rrugë</span>`:""}<br>
    <span class="mute">${esc(dateTxt(tr.date))}${tr.name?" · Shoferi: "+esc(tr.name):""} · ${esc(vanById(tr.van).name)} · ${os.length} porosi${nc?" · "+nc+" veturë në kthim":""}${cities.length?" · "+esc(cities.join(", ")):""}</span></div><div>›</div></div>`}
function renderTrips(){
  if(VIEW==="near")return renderNear();
  if(VIEW&&String(VIEW).startsWith("fuel:"))return renderFuel(VIEW.slice(5));
  if(VIEW)return renderTrip(VIEW);
  const s=S();
  if(!ntf)ntf={name:"",start:s.base,dest:null,date:new Date(Date.now()+864e5).toISOString().slice(0,10),van:"A"};
  const active=DB.trips.filter(t=>!isPast(t)).sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
  const hist=DB.trips.filter(isPast).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
  $("#app").innerHTML=`${onTripCard()}<div class="card"><h2>Udhëtim i ri</h2>
    <label for="f-name">1. Shoferi</label>${driverSelect("f-name",ntf.name)}
    <label>2. Nisja</label>${addrField("f-start",ntf.start,"P.sh. Ferizaj")}
    <label for="f-destsel">3. Destinacioni i fundit</label>${destSelect()}<div id="f-destother" ${ntf.destOrder==="other"||!destOrders().length?"":"hidden"}>${addrField("f-dest",ntf.destOrder==="other"?ntf.dest:null,"P.sh. Dortmund")}</div>
    <label for="f-date">Data e nisjes</label><input id="f-date" type="date" value="${ntf.date}"><label for="f-van">Furgoni</label>${vanSelect(ntf.van)}
    <div id="pickBox"><p class="mute">Duke ngarkuar porositë që presin…</p></div>
    <div id="carBox"></div>
    <button class="btn full" id="add">Krijo udhëtimin</button></div>
    <div class="card"><h2>Udhëtimet e ardhshme</h2>${active.length?"":`<p class="mute">Nuk ka udhëtime të planifikuara.</p>`}
    ${active.slice(0,2).map(tripRow).join("")}
    ${active.length>2?`<details><summary class="mute" style="cursor:pointer;padding:8px 0">Shfaq edhe ${active.length-2} të tjera</summary>${active.slice(2).map(tripRow).join("")}</details>`:""}</div>
    <div class="card"><h2>Historia (${hist.length})</h2>${hist.length?hist.map(tripRow).join(""):`<p class="mute">Udhëtimet e kaluara dhe të përfunduara shfaqen këtu.</p>`}</div>`;
  $("#f-name").onchange=e=>ntf.name=e.target.value;
  const ds=$("#f-destsel");if(ds)ds.onchange=e=>{const v=e.target.value;ntf.destOrder=v;ntf._recDone=false;
    if(v==="other"){ntf.dest=null;$("#f-destother").hidden=false}else{$("#f-destother").hidden=true;ntf.dest=DB.orders.find(o=>o.id===v)?.addr||null}renderPick()};
  $("#f-date").onchange=e=>ntf.date=e.target.value;
  $("#f-van").onchange=e=>{ntf.van=e.target.value;renderPick()};
fillOnTrip();
  wireAddr("f-start",r=>{if(r){ntf.start=r;renderPick()}});
  wireAddr("f-dest",r=>{if(r){ntf.dest=r;ntf.destOrder="other";ntf._recDone=false;renderPick()}});
  renderPick();
  $("#add").onclick=()=>{
    const ids=[...(newTripSel||[])].filter(id=>DB.orders.some(o=>o.id===id&&o.status!=="delivered"));
    DB.trips.forEach(t=>t.orderIds=t.orderIds.filter(x=>!ids.includes(x)));
    const tr={id:uid(),date:ntf.date,name:ntf.name.trim(),start:ntf.start,dest:ntf.dest,van:ntf.van,orderIds:ids,carIds:[],status:"planned",returnIncome:0};
    ids.forEach(id=>{DB.orders.find(o=>o.id===id).tripId=tr.id});
    tr.carIds=[...(ntf.cars||[])].filter(id=>DB.cars.some(c=>c.id===id));
    DB.trips.forEach(t=>t.carIds=(t.carIds||[]).filter(x=>!tr.carIds.includes(x)));tr.carIds.forEach(id=>DB.cars.find(c=>c.id===id).tripId=tr.id);
    DB.trips.unshift(tr);save();newTripSel=null;ntf=null;toast("Udhëtimi u krijua");setTab("trips",tr.id)};
}
// Porositë që presin dorëzimin: pa udhëtim, ose në një udhëtim tjetër që s'ka përfunduar
function waitingOrders(exceptTrip){
  return DB.orders.filter(o=>o.status!=="delivered"&&o.tripId!==exceptTrip&&!onTrip(o));
}
function tripLabel(id){const t=DB.trips.find(x=>x.id===id);return t?dateTxt(t.date)+(t.name?" · "+t.name:""):""}
const DRIVERS=["Maruf","Krenar","Fisnik"];
const myNames=()=>{const w=whoAmI();return w==="Phis"?["Phis","Fisnik"]:w?[w]:[]};
// Udhëtimi në rrugë: ndalesat me radhë, i yti i pari
function onTripCard(){
  const me=myNames(),mine=t=>me.includes(t.name);
  const list=DB.trips.filter(t=>t.status==="onroad").sort((a,b)=>mine(b)-mine(a));
  if(!list.length)return "";
  return list.map(t=>`<div class="card" style="border:2px solid #f0b400"><h2>${mine(t)?"Udhëtimi yt":"Në rrugë: "+esc(t.name||"pa shofer")}</h2>
    <div class="mute">${esc(dateTxt(t.date))} · ${esc(vanById(t.van).name)}</div><div data-ontrip="${t.id}"><p class="mute">Duke rregulluar ndalesat…</p></div>
    <button class="btn yellow full" type="button" onclick="setTab('trips','${t.id}')" style="margin-top:8px">Hap udhëtimin dhe shpenzimet</button></div>`).join("");
}
async function fillOnTrip(){for(const el of document.querySelectorAll("[data-ontrip]")){const t=DB.trips.find(x=>x.id===el.dataset.ontrip);if(!t)continue;
  try{const p=await planTrip(t);if(!el.isConnected)return;
    el.innerHTML=p.stops.length?`<ol style="margin:8px 0 0;padding-left:22px">${p.stops.map(o=>`<li style="margin:4px 0${o.status==="delivered"?";color:var(--mute);text-decoration:line-through":""}"><b>${esc(cityOf(o.addr))}</b> · ${esc(o.customer||"")}<br><span class="mute">${esc(o.addr.label)}</span></li>`).join("")}</ol>`
      +(p.carStops.length?`<p class="mute" style="margin:6px 0 0">Në kthim: ${p.carStops.map(c=>esc((c.model||"Veturë")+" ("+cityOf(c.from)+")")).join(", ")}</p>`:""):`<p class="mute">Nuk ka porosi në këtë udhëtim.</p>`}catch(e){el.innerHTML=""}}}
function driverSelect(id,cur){const list=[...DRIVERS,...(cur&&!DRIVERS.includes(cur)?[cur]:[])];
  return `<select id="${id}"><option value="">— Zgjidh shoferin —</option>${list.map(n=>`<option ${n===cur?"selected":""}>${esc(n)}</option>`).join("")}</select>`}
// Destinacioni i fundit: porositë që presin, e madhja e para (zgjidhet vetë)
function destOrders(){return waitingOrders(null).filter(o=>o.addr&&o.addr.lat).sort((a,b)=>sizeOf(orderGoods(b))-sizeOf(orderGoods(a)))}
function destSelect(){const os=destOrders();if(!os.length)return "";
  if(!ntf.destOrder||(ntf.destOrder!=="other"&&!os.some(o=>o.id===ntf.destOrder))){ntf.destOrder=os[0].id;ntf.dest=os[0].addr;ntf._recDone=false}
  return `<select id="f-destsel">${os.map((o,i)=>{const g=orderGoods(o);return `<option value="${o.id}" ${o.id===ntf.destOrder?"selected":""}>${esc(cityOf(o.addr))} · ${esc(o.customer||"")} · ${g.kg} kg, ${num1(g.m3)} m³${i===0?" (më e madhja)":""}</option>`}).join("")}<option value="other" ${ntf.destOrder==="other"?"selected":""}>Adresë tjetër…</option></select>`}
function driverList(){const n=[...new Set(["Maruf","Krenar",...DB.trips.map(t=>t.name).filter(x=>x&&!["Babai","Vëllai","SHEMBULL"].includes(x))])];return `<datalist id="drivers">${n.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`}
// Porositë që presin, renditur sipas kostos shtesë për rrugën nisje → destinacion
async function renderPick(){
  const box=$("#pickBox");if(!box)return;
  const waiting=waitingOrders(null);
  if(!waiting.length){box.innerHTML=`<p class="mute">S'ka porosi që presin. Shtoji te Çmimi dhe pastaj zgjidhi këtu.</p>`;return}
  const mo=mainOrderOf(waiting),dest=ntf.dest||mo?.addr||ntf.start,D=!!(ntf.dest||mo);
  const v=vanById(ntf.van),pk=perKm(v);
  const M=await distMatrix([ntf.start,dest,...waiting.map(o=>o.addr)]);
  if(TAB!=="trips"||VIEW||!$("#pickBox"))return;
  const direct=M[0][1];
  const rows=waiting.map((o,i)=>{const ex=Math.max(0,M[0][i+2]+M[i+2][1]-direct);return {o,ex,cost:ex*pk,g:orderGoods(o)}}).sort((a,b)=>a.cost-b.cost);
  const lim=Math.max(60,direct*0.15);
  let kg=0,m3=0;rows.forEach(r=>{r.rec=D&&!r.o.tripId&&r.ex<=lim&&kg+r.g.kg<=v.payloadKg&&m3+r.g.m3<=vanVol(v);if(r.rec){kg+=r.g.kg;m3+=r.g.m3}});
  if(!newTripSel)newTripSel=new Set();
  if(ntf.dest&&!ntf._recDone){rows.filter(r=>r.rec).forEach(r=>newTripSel.add(r.o.id))}
  if(ntf.dest)ntf._recDone=true;
  box.innerHTML=(D?`<h3>Porositë që presin (${rows.length}) · ${esc(cityOf(ntf.start))} → ${esc(cityOf(dest))}, ${km(direct)}${M.real?"":" përafërsisht"}</h3>

    :`<h3>Porositë që presin (${rows.length})</h3><p class="mute" style="margin:0 0 4px">Shëno ato që do i marrësh. Zgjidh destinacionin (3) dhe i rendis nga më e lira, me rekomandime.</p>`)+`

      <span style="flex:1"><b>${esc(cityOf(r.o.addr))}</b> · ${esc(r.o.customer||"")} ${r.rec?`<span class="pill good">rekomandohet</span>`:""}${r.o.tripId?` <span class="pill">tani në: ${esc(tripLabel(r.o.tripId))}</span>`:""}<br>
      <span class="mute">${esc(r.o.items?itemsSummary(r.o.items):r.o.what||"")} · ${r.g.est?"≈":""}${r.g.kg} kg · ${num1(r.g.m3)} m³</span><br>
      <span class="mute">${D?`+${km(r.ex)} rrugë shtesë ≈ <b>${eur(r.cost)}</b> kosto · `:""}çmimi ${eur(r.o.price)}</span></span></label>`).join("")}
    <div class="totals" id="pickTot"></div>`;
  const tot=()=>{const os=rows.filter(r=>newTripSel.has(r.o.id));const k=os.reduce((a,r)=>a+r.g.kg,0),m=os.reduce((a,r)=>a+r.g.m3,0);
    $("#pickTot").innerHTML=`<div><b>${os.length}</b><span>Porosi</span></div><div><b style="${k>v.payloadKg?"color:var(--warn)":""}">${Math.round(k)} kg</b><span>nga ${v.payloadKg}</span></div><div><b style="${m>vanVol(v)?"color:var(--warn)":""}">${num1(m)} m³</b><span>nga ${num1(vanVol(v))}</span></div>`};
  box.querySelectorAll("[data-pick]").forEach(c=>c.onchange=()=>{c.checked?newTripSel.add(c.dataset.pick):newTripSel.delete(c.dataset.pick);tot();renderCarPick()});
  tot();renderCarPick();
}
// Veturat që presin të kthehen në shtëpi, renditur sipas kostos shtesë në kthim
function waitingCars(exceptTrip){
  return DB.cars.filter(c=>{if(c.status==="home"||c.tripId===exceptTrip)return false;const t=c.tripId&&DB.trips.find(x=>x.id===c.tripId);return !t||t.status==="done"});
}
async function rankCars(trip,cars,v){
  const pk=perKm(v),orders=trip.orderIds.map(id=>DB.orders.find(o=>o.id===id)).filter(Boolean);
  const base=await routeOf(trip,orders,tripCars(trip).filter(c=>!cars.includes(c)));
  const rows=[];for(const c of cars){const ex=Math.max(0,(await routeOf(trip,orders,[...tripCars(trip).filter(x=>!cars.includes(x)),c])).len-base.len);rows.push({c,ex,cost:ex*pk,net:netRec(c)-(+c.docs||0)-ex*pk})}
  return rows.sort((a,b)=>b.net-a.net);
}
function carRowHtml(r,extra,v){const f=v?carFit(r.c,v):{ok:true};return `<span style="flex:1"><b>${esc(r.c.model||"Veturë")}</b>${r.c.year?" "+esc(r.c.year):""} · ${esc(cityOf(r.c.from))}${extra||""}${f.ok?"":` <span class="pill warn">${esc(f.txt)}</span>`}<br>

  <span class="mute">${esc(r.c.owner||"")}${telLink(r.c)} · çmimi ${eur(r.c.price||0)}</span><br>
  <span class="mute">+${km(r.ex)} në kthim ≈ ${eur(r.cost)} kosto · fitimi <b style="color:${r.net<0?"var(--warn)":"var(--good)"}">${eur(r.net)}</b></span></span>`}

    <p id="carNow" style="margin:8px 0 0"></p>`;
  const now=()=>{const sel=rows.filter(r=>ntf.cars.has(r.c.id));$("#carNow").innerHTML=sel.length?`Merr në kthim: <b>${sel.map(r=>esc((r.c.model||"Veturë")+" nga "+cityOf(r.c.from))).join(", ")}</b>`:`<span class="mute">Pa veturë në kthim.</span>`};

function applyRemote(key,v,del){
  const t=key.slice(0,2),id=key.slice(2),arr=t==="o_"?DB.orders:t==="t_"?DB.trips:t==="c_"?DB.cars:t==="f_"?(DB.fills=DB.fills||[]):null;

  if(!arr)return;const i=arr.findIndex(x=>x.id===id);
  if(del){if(i>=0)arr.splice(i,1)}else{const rec=JSON.parse(v);if(i>=0)arr[i]=rec;else arr.push(rec)}

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function syncStart(){
  if(!FB_CONFIG||SYNC.fs)return;
  try{
    for(const m of ["app","auth","firestore"])await loadScript(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-${m}-compat.js`);
    firebase.initializeApp(FB_CONFIG);
    const fs=firebase.firestore();try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
    SYNC.fs=fs;
    firebase.auth().onAuthStateChanged(u=>{SYNC.user=u;if(u)syncListen();else{SYNC.on=false;if(SYNC.unsub)SYNC.unsub()}if(TAB==="settings")render()});
  }catch(e){SYNC.err="Nuk u ngarkua (pa internet?)"}
}
function syncListen(){
  if(SYNC.unsub)SYNC.unsub();
  const col=SYNC.fs.collection("gemini");let first=true;
  SYNC.unsub=col.onSnapshot({includeMetadataChanges:false},snap=>{
    let changed=false;
    if(first){first=false;
      // hyrja e parë: çfarë s'është në server (p.sh. porositë e vjetra të këtij telefoni) ngarkohet; çfarë është në server vjen këtu
      const remote={};snap.docs.forEach(d=>remote[d.id]=d.data());
      SYNC.known={};
      Object.entries(remote).forEach(([k,d])=>{if(d.del)applyRemote(k,null,true);else{applyRemote(k,d.v,false);SYNC.known[k]=d.v}changed=true});
      SYNC.on=true;SYNC.ready=true;
    }else{
      snap.docChanges().forEach(ch=>{const d=ch.doc.data(),k=ch.doc.id;if(ch.doc.metadata.hasPendingWrites)return;
        if(d.del){applyRemote(k,null,true);delete SYNC.known[k]}else if(SYNC.known[k]!==d.v){applyRemote(k,d.v,false);SYNC.known[k]=d.v}else return;
        changed=true});
    }
    SYNC.last=new Date();
    if(changed){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}saveKnown();softRender()}
    syncPush();
  },e=>{SYNC.err=e.code==="permission-denied"?"Ky email s'ka leje. Pyet Phis-in.":"Gabim: "+e.message;if(TAB==="settings")render()});
}
// Dërgon vetëm ndryshimet (krahasuar me atë që di serveri)
function syncPush(){
  if(!SYNC.on||!SYNC.fs||!SYNC.user)return;
  const cur=syncRecords(),col=SYNC.fs.collection("gemini"),by=SYNC.user.email||"",u=Date.now();
  let batch=SYNC.fs.batch(),n=0;const flush=()=>{if(n){batch.commit().catch(e=>{SYNC.err="Nuk u dërgua: "+e.message});batch=SYNC.fs.batch();n=0}};
  for(const [k,v] of Object.entries(cur))if(SYNC.known[k]!==v){batch.set(col.doc(k),{v,u,by,del:false});SYNC.known[k]=v;if(++n>=400)flush()}
  for(const k of Object.keys(SYNC.known))if(!(k in cur)){batch.set(col.doc(k),{v:"",u,by,del:true});delete SYNC.known[k];if(++n>=400)flush()}
  flush();saveKnown();
}
const syncPushSoon=debounce(syncPush,600);window.__syncPush=syncPushSoon;

    ${SYNC.err?`<p><span class="pill warn">${esc(SYNC.err)}</span></p>`:""}<button class="btn ghost small" id="sy-out" type="button">Dil</button></div>`;
}
function wireSync(){
  const b=$("#sy-login");if(b)b.onclick=async()=>{SYNC.err="";b.textContent="Duke hyrë…";
    try{await firebase.auth().signInWithEmailAndPassword($("#sy-email").value.trim(),$("#sy-pass").value)}catch(e){SYNC.err=/password|credential|user/.test(e.code||"")?"Email ose fjalëkalim i gabuar":"Nuk u lidh: "+(e.code||e.message);render()}};
  const o=$("#sy-out");if(o)o.onclick=()=>{firebase.auth().signOut()};
  const em=()=>($("#sy-email")?.value||"").trim().toLowerCase();
  const nw=$("#sy-new");if(nw)nw.onclick=async()=>{const p=$("#sy-pass").value;SYNC.err="";
    if(!TEAM.includes(em())){SYNC.err="Ky email nuk është në listën e ekipit";return render()}
    if(p.length<6){SYNC.err="Fjalëkalimi duhet të ketë të paktën 6 shkronja";return render()}
    try{await firebase.auth().createUserWithEmailAndPassword(em(),p);toast("Llogaria u krijua")}catch(e){SYNC.err=e.code==="auth/email-already-in-use"?"Ky email ka llogari. Shtyp “Hyr”.":"Nuk u krijua: "+(e.code||e.message);render()}};
  const rs=$("#sy-reset");if(rs)rs.onclick=async()=>{if(!em()){SYNC.err="Shkruaj email-in";return render()}
    try{await firebase.auth().sendPasswordResetEmail(em());toast("Të dërguam email për fjalëkalim të ri")}catch(e){SYNC.err="Nuk u dërgua: "+(e.code||e.message);render()}};
}
syncStart();

/* ===================== NISJA ===================== */
function render(){
  const client=location.hash==="#klient";
  document.body.classList.toggle("client",client);
  $("#nav").hidden=client;
  if(client){$("#sub").textContent="";return renderClient()}
  renderNav();const sub=$("#sub");sub.textContent=DB.orders.filter(o=>o.status!=="delivered").length+" porosi të hapura ›";sub.style.cursor="pointer";sub.setAttribute("role","button");sub.onclick=()=>setTab("orders");
  ({quote:renderQuote,orders:renderOrders,trips:renderTrips,client:renderClient,settings:renderSettings})[TAB]();
}
window.addEventListener("hashchange",render);
render();
// Çmimet e naftës përditësohen vetë çdo javë (GitHub: phishalili/gemini-logistics → prices.json)
const PRICES_URL="https://phishalili.github.io/gemini-logistics/prices.json";
async function syncPrices(manual){
  const s=S();if(!manual&&s.dieselAuto===false)return;
  try{const r=await fetch(PRICES_URL+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();
    s.dieselChecked=new Date().toISOString().slice(0,10);if(j.stations)s.dieselStations=j.stations;if(Array.isArray(j.route))s.routeStations=j.route;if(j.sources)s.dieselSrc=j.sources;
    const ch=Object.entries(j.diesel||{}).filter(([k,v])=>+v>0.5&&+v<4&&+s.diesel[k]!==+v);
    const was=s.dieselUpdated;s.dieselUpdated=j.updated||s.dieselChecked;
    if(ch.length){ch.forEach(([k,v])=>s.diesel[k]=+v);save();toast("Çmimet e naftës u përditësuan ("+fmtDay(s.dieselUpdated)+")");render()}
    else{save();if(manual)toast("Çmimet e naftës janë të fundit");if(manual||was!==s.dieselUpdated)refreshFuelBar()}
  }catch(e){if(manual)toast("Nuk ka internet. Çmimet mbeten si ishin.");refreshFuelBar()}
}
function fmtDay(d){const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(d||"");return m?`${m[3]}.${m[2]}.${m[1]}`:(d||"")}
function fuelBarInner(){const s=S(),on=navigator.onLine!==false;
  return `<div style="flex:1;min-width:0"><div>Nafta sot: <b>${eur(dieselPrice())}</b>/L</div><div class="mute" style="font-size:.85em">${s.dieselUpdated?"Përditësuar "+esc(fmtDay(s.dieselUpdated)):"Pa përditësim ende"}${on?"":" · pa internet"}</div></div><button class="btn small" type="button" onclick="setTab('trips','near')">Afër meje</button><button class="btn ghost small" type="button" id="fuel-sync" aria-label="Kontrollo çmimet">↻</button>`}
function fuelBar(){return `<div class="card" id="fuelbar" style="display:flex;gap:10px;align-items:center;padding:10px 14px">${fuelBarInner()}</div>`}
function wireFuelBar(){const b=$("#fuel-sync");if(b)b.onclick=()=>syncPrices(true)}
function refreshFuelBar(){const el=$("#fuelbar");if(el){el.innerHTML=fuelBarInner();wireFuelBar()}}
syncPrices(false);syncStations();
addEventListener("online",()=>{refreshFuelBar();syncPrices(false)});addEventListener("offline",refreshFuelBar);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S().dieselChecked!==new Date().toISOString().slice(0,10))syncPrices(false)});
if("serviceWorker" in navigator&&location.protocol==="https:"){
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadSW&&!reloaded){reloaded=true;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;location.reload()}});
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{const chk=()=>r.update().catch(()=>{});document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk()});setInterval(chk,10*60e3)}).catch(()=>{});
}
</script>
