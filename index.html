<style>
details.more{margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
details.more>summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--acc);list-style:none}

/* Gemini Cars & Logistics: royal-blue G mark, Montserrat wordmark, dark-grey tagline */
:root{--bg:#f2f4f9;--card:#fff;--ink:#1c2333;--mute:#646c80;--line:#dde2ee;--acc:#1f3fa0;--deep:#203471;--acc2:#e6ecfa;--onacc:#fff;--warn:#a1360f;--warnbg:#fff0e8;--good:#17733a;--goodbg:#e5f5eb;
  --f:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1222;--card:#151d33;--ink:#e7ebf5;--mute:#9aa3ba;--line:#26304a;--acc:#7c9cff;--deep:#a9bcff;--acc2:#1d2a4d;--onacc:#0c1222;--warn:#ffb08a;--warnbg:#3b1f12;--good:#7fdca0;--goodbg:#13301f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0c1222;--card:#151d33;--ink:#e7ebf5;--mute:#9aa3ba;--line:#26304a;--acc:#7c9cff;--deep:#a9bcff;--acc2:#1d2a4d;--onacc:#0c1222;--warn:#ffb08a;--warnbg:#3b1f12;--good:#7fdca0;--goodbg:#13301f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);padding-bottom:84px}
body.client{padding-bottom:24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:10px}
header .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;color:var(--acc);font-size:17px}
header .brand small{display:block;font-size:9px;letter-spacing:.14em;color:var(--mute);font-weight:700}
header img{height:34px;width:auto}
main{padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);z-index:5}
nav button{flex:1;background:none;border:0;padding:10px 2px;font:600 11px var(--f);color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
h2{font-size:17px;margin:2px 0 10px;font-weight:800}
h3{font-size:12px;margin:16px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
label{display:block;font-size:12.5px;color:var(--mute);margin:9px 0 3px;font-weight:600}
input,select,textarea{width:100%;font:500 15px var(--f);padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.cmenu{position:fixed;inset:0;background:#0006;z-index:50;display:flex;align-items:flex-end;justify-content:center}.cm-box{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}.cm-btn{display:block;text-align:center;padding:14px;border-radius:12px;font-weight:700;font-size:16px;text-decoration:none;color:var(--ink);background:var(--bg);border:0}
a[href^="tel:"]{color:var(--acc);text-decoration:none;font-weight:600;white-space:nowrap}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{display:inline-block;border:0;border-radius:12px;padding:13px 16px;font:700 16px var(--f);background:var(--acc);color:var(--onacc);text-decoration:none;text-align:center;cursor:pointer}
.btn.ghost{background:var(--acc2);color:var(--acc)}
.btn.warn{background:var(--warnbg);color:var(--warn)}
.btn.small{padding:7px 10px;font-size:13px}
.btn.full{width:100%;margin-top:12px}
.mute{color:var(--mute);font-size:13px}
.price{font-size:34px;font-weight:800;color:var(--acc);letter-spacing:-.01em}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}td:last-child{text-align:right;white-space:nowrap;padding-left:8px;font-variant-numeric:tabular-nums}
.sug{position:relative}
.sug ul{position:absolute;left:0;right:0;top:100%;margin:2px 0 0;padding:0;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:4;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(10,20,60,.18)}
.sug li{padding:10px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);font-weight:700}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.good{background:var(--goodbg);color:var(--good)}
.stop{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.stop:last-child{border-bottom:0}
.num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-weight:800;font-size:13px}
.stop .grow{flex:1;min-width:0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0 2px}.bar i{display:block;height:100%;background:var(--acc)}
.bar.over i{background:var(--warn)}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;background:var(--bg)}
.item .top{display:flex;gap:8px;align-items:center}
.item .top select{flex:1}
.item .top input{width:70px;flex:0 0 70px}
.item .x{background:none;border:0;color:var(--mute);font-size:22px;line-height:1;padding:4px 6px;cursor:pointer}
.item .dims{display:flex;gap:6px;margin-top:6px}.item .dims.lab{margin:6px 0 -3px}.item .dims.lab span{flex:1;min-width:0;font-size:11px;color:var(--mute);font-weight:600;padding-left:2px}.item .dims>input{flex:1}.item .dims input{min-width:0;padding:8px;font-size:14px}
.totals{display:flex;gap:8px;margin-top:10px}.totals div{flex:1;background:var(--acc2);border-radius:10px;padding:8px;text-align:center}
.totals b{display:block;font-size:16px;color:var(--acc)}.totals span{font-size:11px;color:var(--mute);font-weight:600}
.hero{text-align:center;padding:18px 8px 6px}.hero img{width:170px;max-width:60%}
.hero p{margin:6px 0 0;color:var(--mute)}
[hidden]{display:none!important}
.p3d{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px;min-height:120px}
#toast{position:fixed;left:16px;right:16px;bottom:96px;background:var(--ink);color:var(--bg);padding:12px;border-radius:10px;text-align:center;z-index:9;font-weight:600}

      if(len(nt)+1e-9<len(tour)){tour=nt;improved=true}}}
  return {order:tour.slice(1,-1),len:len(tour)};
}

/* ===================== MALLRAT: VËLLIMI, PESHA, A HYN ===================== */
const vol=d=>d.w*d.l*d.h;
const vanVol=v=>vol(v.cargo)+vol(v.trailer);
const vanById=id=>S().vans.find(v=>v.id===id)||S().vans[0];
// "furgoni mesatar": për oferta, para se të vendoset cili furgon e merr porosinë
function avgVan(){const V=S().vans,a=k=>V.reduce((x,v)=>x+(+v[k]||0),0)/V.length,ad=(p,k)=>V.reduce((x,v)=>x+v[p][k],0)/V.length;
  return {id:"avg",name:"furgonit mesatar",lPer100:a("lPer100"),payloadKg:a("payloadKg"),cargo:{w:ad("cargo","w"),l:ad("cargo","l"),h:ad("cargo","h")},trailer:{w:ad("trailer","w"),l:ad("trailer","l"),h:ad("trailer","h")}}}
// llogarit totalin e mallrave; pesha vlerësohet kur mungon
function goods(items){
  let m3=0,kg=0,est=false,pcs=0;
  for(const it of items){const q=+it.qty||0;if(!q)continue;pcs+=q;
    const v=(+it.l||0)*(+it.w||0)*(+it.h||0)/1e6; m3+=v*q;
    if(+it.kg>0)kg+=it.kg*(perM(it)?units(it):q); else {kg+=v*S().densityKgM3*q; est=true}}
  return {m3:Math.round(m3*100)/100,kg:Math.round(kg),est,pcs};
}
// a hyn copa në rimorkio ose në furgon (lejohet rrotullimi)
// kuzhina: çmimi dhe pesha llogariten për metër gjatësi (vjen në elemente, pra s'ka kontroll "a hyn")
const perM=it=>it.preset!=="x"&&!!S().presets[it.preset]?.perM;
const units=it=>(+it.qty||0)*(perM(it)?(+it.l||0)/100:1);
function fitsPiece(it,v){if(perM(it))return true;const p=[+it.l,+it.w,+it.h].map(x=>(x||0)/100).sort((a,b)=>a-b);
  return [v.trailer,v.cargo].some(s=>{const q=[s.l,s.w,s.h].sort((a,b)=>a-b);return p.every((x,i)=>x<=q[i])})}
function orderGoods(o){return o.items?goods(o.items):{m3:+o.m3||0,kg:+o.kg||0,est:false,pcs:o.pcs||1}}

/* ===================== KOSTOT DHE ÇMIMI ===================== */
function dieselPrice(){const s=S(),h=s.fuelHomeShare/100;return h*(s.diesel.XK||0)+(1-h)*(s.diesel[s.fuelAwayCountry]||0)}
function perKm(v){return v.lPer100/100*dieselPrice()+S().wearPerKm}
function fixedPerTrip(){const s=S();return s.fixedYear.reduce((a,b)=>a+(+b.eur||0),0)/Math.max(1,s.tripsPerYear)}
function tripCostBreakdown(v,kmTotal){
  const s=S(),L=kmTotal*v.lPer100/100;
  const rows=[
    ["Nafta ("+Math.round(L)+" L × "+eur(dieselPrice())+")",L*dieselPrice()],
    ["Konsumimi & servisi ("+km(kmTotal)+" × "+eur(s.wearPerKm)+")",kmTotal*s.wearPerKm],
    ["Autostradat / taksat",s.tollsPerTrip.reduce((a,b)=>a+(+b.eur||0),0)],
    ["Sigurimi & vinjetat (pjesa për udhëtim)",fixedPerTrip()],
    ["Shpenzimet e shoferit ("+s.daysPerTrip+" ditë)",s.daysPerTrip*s.driverPerDay*s.driversPerVan]];
  const total=rows.reduce((a,r)=>a+r[1],0),ret=total*s.returnShare/100;
  if(ret)rows.push(["E paguar nga veturat në kthim (−"+s.returnShare+"%)",-ret]);
  return {rows,total:total-ret};
}
function shareOf(g,v){return Math.max((g.kg||0)/v.payloadKg,(g.m3||0)/vanVol(v))}
const vatR=()=>(+S().vat||0)/100;
const netOf=(gross,on=true)=>(+gross||0)/(on?1+vatR():1);
const netRec=x=>netOf(x.price,x.vatOn!==false);   // porosia/vetura: çmimi pa TVSH
function priceFromCost(c){const s=S();return Math.max(s.minPrice,Math.ceil(c*(1+s.margin/100)/5)*5)}
// Mallrat me çmim fiks (p.sh. kuzhina 250 €/m) + mallrat e llogaritur sipas hapësirës/peshës + shtesa për adresën
const rateOf=it=>it.preset==="x"?0:(+S().presets[it.preset]?.rate||0);
async function quote(g,addr,items=[],opt={}){ // çmimi kthehet ME TVSH; net = pa TVSH
  const s=S(),v=avgVan(),mk=1+s.margin/100;
  const M=await distMatrix([s.base,s.hub,addr]);
  const lineKm=M[0][1]+M[1][0];
  const detourKm=Math.max(0,M[1][2]+M[2][0]-M[1][0]);
  const trip=tripCostBreakdown(v,lineKm);
  const share=shareOf(g,v), lineShare=Math.min(1,share/(s.loadFactor/100));
  const detourCost=detourKm*perKm(v);
  const cost=trip.total*lineShare+detourCost+s.handling+(+opt.docs||0); // kostoja jonë reale
  const fixed=items.filter(i=>(+i.qty)&&rateOf(i)>0), calc=items.filter(i=>(+i.qty)&&!(rateOf(i)>0));
  const fixedSum=fixed.reduce((a,i)=>a+units(i)*rateOf(i),0);
  const gc=items.length?goods(calc):g, cShare=Math.min(1,shareOf(gc,v)/(s.loadFactor/100));
  const calcPrice=(gc.m3||gc.kg)?(trip.total*cShare+s.handling)*mk:0;
  const extra=detourCost*mk;
  const vatOn=opt.vat!==false,docs=+opt.docs||0,vr=vatOn?vatR():0;
  const netRaw=Math.max(s.minPrice,fixedSum+calcPrice+extra)+docs;
  const price=Math.ceil(netRaw*(1+vr)/5)*5,net=price/(1+vr),vat=price-net;
  return {net,vat,vatOn,docs,v,lineKm,detourKm,trip,share,byWeight:(g.kg/v.payloadKg)>=(g.m3/vanVol(v)),lineShare,detourCost,cost,price,real:M.real,fixed,fixedSum,calcPrice,cShare,extra,hasCalc:!!(gc.m3||gc.kg)};
}
// Rruga: nga nisja → ndalesat (radha më e mirë) → destinacioni → kthim në shtëpi. Pa nisje/destinacion: rreth nga shtëpia.
function bestPath(M){ // 0 = nisja, n-1 = destinacioni (fiks)
  const n=M.length;if(n<=2)return {order:[],len:n===2?M[0][1]:0};
  let tour=[0],left=new Set([...Array(n-1).keys()].slice(1));
  while(left.size){const last=tour[tour.length-1];let b=null,bd=1e18;for(const j of left)if(M[last][j]<bd){bd=M[last][j];b=j}tour.push(b);left.delete(b)}
  tour.push(n-1);
  const len=tr=>tr.reduce((s,v,i)=>i?s+M[tr[i-1]][v]:0,0);
  let improved=true;
  while(improved){improved=false;
    for(let i=1;i<tour.length-2;i++)for(let k=i+1;k<tour.length-1;k++){
      const nt=[...tour.slice(0,i),...tour.slice(i,k+1).reverse(),...tour.slice(k+1)];
      if(len(nt)+1e-9<len(tour)){tour=nt;improved=true}}}
  return {order:tour.slice(1,-1),len:len(tour)};
}
function tripCars(trip){return (trip.carIds||[]).map(id=>DB.cars.find(c=>c.id===id)).filter(Boolean)}
// Vajtja: nisja → porositë → destinacioni. Kthimi: destinacioni (ose ndalesa e fundit) → veturat → baza.
async function routeOf(trip,orders,cars=tripCars(trip)){
  const s=S();let order,outLen,E,real=true;
  if(trip.start&&trip.dest){
    const M=await distMatrix([trip.start,...orders.map(o=>o.addr),trip.dest]);real=M.real;
    const bp=bestPath(M);order=bp.order.map(i=>orders[i-1]);outLen=bp.len;E=trip.dest;
  }else{
    const M=await distMatrix([s.base,...orders.map(o=>o.addr)]),b=bestOrder(M);real=M.real;
    order=b.order.map(i=>orders[i-1]);
    if(order.length){const li=orders.indexOf(order[order.length-1])+1;outLen=b.len-M[li][0];E=order[order.length-1].addr}else{outLen=0;E=s.base}
  }
  const R=await distMatrix([E,...cars.map(c=>c.from),s.base]);
  const bp2=bestPath(R);
  return {order,cars:bp2.order.map(i=>cars[i-1]),len:outLen+bp2.len,back:bp2.len,real:real&&R.real,end:E};
}
async function planTrip(trip){
  const s=S(),v=vanById(trip.van);
  const orders=trip.orderIds.map(id=>DB.orders.find(o=>o.id===id)).filter(Boolean);
  const r=await routeOf(trip,orders);
  const costs=tripCostBreakdown(v,r.len);
  const kg=orders.reduce((a,o)=>a+orderGoods(o).kg,0),m3=orders.reduce((a,o)=>a+orderGoods(o).m3,0);
  const tc=tripCars(trip),sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
  const carsIn=sum(tc,netRec),ordersIn=sum(orders,netRec),vatAmt=sum(tc,x=>+x.price||0)+sum(orders,x=>+x.price||0)-carsIn-ordersIn;
  const docs=sum(tc,x=>+x.docs||0)+sum(orders,x=>+x.docs||0);
  const revenue=ordersIn+carsIn+(+trip.returnIncome||0);
  return {v,orders,stops:r.order,carStops:r.cars,carsIn,ordersIn,vatAmt,docs,back:r.back,kmTotal:r.len,costs,kg,m3,revenue,profit:revenue-costs.total-orders.length*s.handling-docs,real:r.real};
}
async function extraKm(trip,o){
  const orders=trip.orderIds.map(id=>DB.orders.find(x=>x.id===id)).filter(Boolean);
  return (await routeOf(trip,[...orders,o])).len-(await routeOf(trip,orders)).len;
}

function tripStations(p,tr){

    const name=it.preset==="x"?"Mall":(P[it.preset]?.name||"Mall").replace(/\s*\(.*\)/,"");
    const kgEach=+it.kg>0?+it.kg:L*W*H/1e6*S().densityKgM3,pr=it.preset==="x"?{}:(P[it.preset]||{}),fl={noTop:!!pr.noTop,up:!!pr.up};
    if(perM(it)){const seg=Math.min(100,+P[it.preset].l||100);let total=units(it)*100,n=1;
      while(total>0.5){const len=Math.min(seg,total);out.push({l:len,w:W,h:H,kg:kgEach*len/100,name:name+" "+n++,tag,color,elem:true});total-=len}}
    else for(let k=0;k<q;k++)out.push({l:L,w:W,h:H,kg:kgEach,name:q>1?`${name} ${k+1}`:name,tag,color,...fl})});
  return out;
}
// Hapësirat: rimorkioja dhe furgoni (cm). Mbushja nga përpara (x=0) drejt derës.
function spacesOf(v){return [{key:"trailer",name:"Rimorkioja",L:v.trailer.l*100,W:v.trailer.w*100,H:v.trailer.h*100},{key:"van",name:"Furgoni",L:v.cargo.l*100,W:v.cargo.w*100,H:v.cargo.h*100}]}
function packPieces(pieces,v,opt={}){
  const spaces=spacesOf(v).map(s=>({...s,boxes:[],eps:[{x:0,y:0,z:0}]}));
  const unplaced=[];
  const ov=(a0,a1,b0,b1)=>Math.min(a1,b1)-Math.max(a0,b0);
  for(const p of pieces){
    const oris=[[p.l,p.w,p.h],[p.w,p.l,p.h]];
    if(opt.tip&&!p.elem&&!p.up)oris.push([p.l,p.h,p.w],[p.h,p.l,p.w],[p.w,p.h,p.l],[p.h,p.w,p.l]);
    let best=null;
    for(const sp of spaces){
      for(const e of sp.eps)for(const [l,w,h] of oris){
        if(e.x+l>sp.L+0.01||e.y+w>sp.W+0.01||e.z+h>sp.H+0.01)continue;
        let hit=false;for(const b of sp.boxes){if(ov(e.x,e.x+l,b.x,b.x+b.l)>0.01&&ov(e.y,e.y+w,b.y,b.y+b.w)>0.01&&ov(e.z,e.z+h,b.z,b.z+b.h)>0.01){hit=true;break}}
        if(hit)continue;
        if(e.z>0.01){let sup=0;for(const b of sp.boxes){if(Math.abs(b.z+b.h-e.z)<0.5){const a=ov(e.x,e.x+l,b.x,b.x+b.l),c=ov(e.y,e.y+w,b.y,b.y+b.w);if(a>0&&c>0)sup+=a*c}}
          if(sup<0.75*l*w)continue;
          // asgjë mbi divane, kolltukë, frigoriferë
          if(sp.boxes.some(b=>b.noTop&&Math.abs(b.z+b.h-e.z)<0.5&&ov(e.x,e.x+l,b.x,b.x+b.l)>0&&ov(e.y,e.y+w,b.y,b.y+b.w)>0))continue;
          // mos vër të rëndën mbi të lehtën
          if(sp.boxes.some(b=>Math.abs(b.z+b.h-e.z)<0.5&&ov(e.x,e.x+l,b.x,b.x+b.l)>0&&ov(e.y,e.y+w,b.y,b.y+b.w)>0&&b.kg<p.kg*0.5))continue}
        const score=(sp.key==="trailer"?0:1e9)+e.x*1e4+e.z*10+e.y; // rimorkio e para, pastaj përpara, poshtë, majtas
        if(!best||score<best.score)best={sp,x:e.x,y:e.y,z:e.z,l,w,h,score}}}
    if(!best){unplaced.push(p);continue}
    const b={...p,x:best.x,y:best.y,z:best.z,l:best.l,w:best.w,h:best.h,step:0},sp=best.sp;
    sp.boxes.push(b);
    sp.eps=sp.eps.filter(e=>!(e.x>=b.x-0.01&&e.x<b.x+b.l-0.01&&e.y>=b.y-0.01&&e.y<b.y+b.w-0.01&&e.z>=b.z-0.01&&e.z<b.z+b.h-0.01));
    for(const e of [{x:b.x+b.l,y:b.y,z:b.z},{x:b.x,y:b.y+b.w,z:b.z},{x:b.x,y:b.y,z:b.z+b.h},{x:b.x+b.l,y:0,z:b.z},{x:b.x,y:0,z:b.z+b.h},{x:0,y:b.y+b.w,z:b.z}])
      if(!sp.eps.some(f=>Math.abs(f.x-e.x)<0.01&&Math.abs(f.y-e.y)<0.01&&Math.abs(f.z-e.z)<0.01))sp.eps.push(e);
  }
  let n=1;for(const sp of spaces)for(const b of sp.boxes)b.step=n++;
  return {spaces,unplaced};
}
function posTxt(b,sp){const third=sp.L/3,c=b.x+b.l/2,m=b.y+b.w/2;
  return `${c<third?"përpara":c<2*third?"në mes":"te dera"}, ${m<sp.W*0.4?"majtas":m>sp.W*0.6?"djathtas":"në qendër"}, ${b.z<1?"në dysheme":"sipër ("+Math.round(b.z)+" cm)"}`}

    <div class="totals">${used.map(u=>`<div><b>${u.pct.toFixed(0)}%</b><span>${u.sp.name} · zë ${Math.round(u.len)}/${Math.round(u.sp.L)} cm</span></div>`).join("")}<div><b style="${kg>v.payloadKg?"color:var(--warn)":""}">${Math.round(kg)} kg</b><span>nga ${v.payloadKg}</span></div></div>

    ${legend.length?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${legend.map(l=>`<span class="pill" style="background:${PCOL[l.color%PCOL.length]}22;color:var(--ink)"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${PCOL[l.color%PCOL.length]};margin-right:5px"></i>${esc(l.label)}</span>`).join("")}</div>`:""}
    ${pieces.length?`<details style="margin-top:8px"><summary style="font-weight:700;cursor:pointer">Radha e ngarkimit hap pas hapi</summary><ol style="padding-left:20px;font-size:13.5px;margin:6px 0">${res.spaces.flatMap(sp=>sp.boxes.map(b=>`<li><b>${esc(b.name)}</b>${b.tag?` (${esc(b.tag)})`:""}: ${sp.name.toLowerCase()}, ${posTxt(b,sp)}${(b.l!==undefined)?` · ${Math.round(b.l)}×${Math.round(b.w)}×${Math.round(b.h)}`:""}</li>`)).join("")}</ol></details>`:""}`;
  draw3d(elId+"-c",res,v);

function draw3d(cid,res,v){
  const box=document.getElementById(cid);if(!box)return;
  if(!window.THREE){box.innerHTML=`<p class="mute" style="padding:12px">Pamja 3D kërkon internet herën e parë.</p>`;return}
  const T=THREE,W=box.clientWidth||340,H=Math.round(W*0.62);
  const r=new T.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(2,window.devicePixelRatio||1));r.setSize(W,H);box.appendChild(r.domElement);
  const sc=new T.Scene(),cam=new T.PerspectiveCamera(35,W/H,0.1,200);
  sc.add(new T.AmbientLight(0xffffff,0.75));const dl=new T.DirectionalLight(0xffffff,0.55);dl.position.set(-4,10,6);sc.add(dl);
  const css=getComputedStyle(document.documentElement),ink=new T.Color(css.getPropertyValue("--mute").trim()||"#667");

  const m=x=>x/100,vanL=v.cargo.l,gap=0.9;
  const offs={van:0.9,trailer:0.9+vanL+gap};
  const edge=(w,h,d,col,op)=>{const g=new T.BoxGeometry(w,h,d);const e=new T.LineSegments(new T.EdgesGeometry(g),new T.LineBasicMaterial({color:col,transparent:op<1,opacity:op}));return e};
  // kabina
  const cab=new T.Mesh(new T.BoxGeometry(0.85,1.6,v.cargo.w),new T.MeshLambertMaterial({color:0x9aa3b5}));cab.position.set(0.425,0.8+0.4,v.cargo.w/2);grp.add(cab);
  for(const sp of res.spaces){const ox=offs[sp.key],L=m(sp.L),Wd=m(sp.W),Hh=m(sp.H);
    const fl=new T.Mesh(new T.BoxGeometry(L,0.02,Wd),new T.MeshLambertMaterial({color:0x8d96a8,transparent:true,opacity:0.35}));fl.position.set(ox+L/2,0.39,Wd/2);grp.add(fl);
    const fr=edge(L,Hh,Wd,ink,0.9);fr.position.set(ox+L/2,0.4+Hh/2,Wd/2);grp.add(fr);
    // rrotat
    for(const wx of (sp.key==="trailer"?[L/2-0.4,L/2+0.4]:[0.5,L-0.6]))for(const wz of [0,Wd]){const wh=new T.Mesh(new T.CylinderGeometry(0.33,0.33,0.2,20),new T.MeshLambertMaterial({color:0x333a48}));wh.rotation.x=Math.PI/2;wh.position.set(ox+wx,0.33,wz);grp.add(wh)}
    for(const b of sp.boxes){const g=new T.BoxGeometry(m(b.l)-0.01,m(b.h)-0.01,m(b.w)-0.01);
      const mesh=new T.Mesh(g,new T.MeshLambertMaterial({color:PCOL[b.color%PCOL.length]}));mesh.position.set(ox+m(b.x+b.l/2),0.4+m(b.z+b.h/2),m(b.y+b.w/2));grp.add(mesh);
      const e=new T.LineSegments(new T.EdgesGeometry(g),new T.LineBasicMaterial({color:0x10182a,transparent:true,opacity:0.6}));e.position.copy(mesh.position);grp.add(e);
      // numri i hapit sipër
      const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d");x.fillStyle="#fff";x.beginPath();x.arc(32,32,28,0,7);x.fill();x.fillStyle="#1c2333";x.font="bold 34px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(b.step,32,34);
      const spr=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),depthTest:false}));spr.scale.set(0.28,0.28,1);spr.position.set(mesh.position.x,0.4+m(b.z+b.h)+0.12,mesh.position.z);grp.add(spr)}}
  // tërheqësi
  const bar=new T.Mesh(new T.BoxGeometry(gap,0.06,0.06),new T.MeshLambertMaterial({color:0x333a48}));bar.position.set(offs.van+vanL+gap/2,0.45,v.cargo.w/2);grp.add(bar);
  const total=offs.trailer+v.trailer.l,center=new T.Vector3(total/2,1.5,v.trailer.w/2);
  let th=-0.5,ph=1.0,rad=total*1.4;
  const place=()=>{cam.position.set(center.x+rad*Math.sin(ph)*Math.sin(th),center.y+rad*Math.cos(ph),center.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(center);r.render(sc,cam)};
  place();
  const pts=new Map();let last=null,pinch=null;
  const cv=r.domElement;cv.style.touchAction="none";cv.style.width="100%";cv.style.height="auto";cv.style.borderRadius="12px";
  cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY})});
  cv.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);
    if(pts.size===1){th-=(e.clientX-p.x)*0.01;ph=Math.min(1.5,Math.max(0.15,ph-(e.clientY-p.y)*0.01));}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});

    place()});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);

async function fitsOnTrips(o){
  const open=DB.trips.filter(tr=>tr.status!=="done");if(!open.length)return "";
  const rows=[];
  for(const tr of open){const p=await planTrip(tr),v=p.v,ex=await extraKm(tr,o);
    rows.push({tr,ex,ok:p.kg+o.kg<=v.payloadKg&&p.m3+o.m3<=vanVol(v),cost:ex*perKm(v)})}
  rows.sort((a,b)=>(b.ok-a.ok)||(a.ex-b.ex));
  const opt=(v,checked,dis,html)=>`<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;font-weight:500"><input type="radio" name="fit" value="${v}" style="width:auto" ${checked?"checked":""} ${dis?"disabled":""}><span>${html}</span></label>`;
  return `<h3>Hyn në një udhëtim të planifikuar?</h3>`+rows.map((r,i)=>opt(r.tr.id,i===0&&r.ok,!r.ok,`<b>${esc(dateTxt(r.tr.date))}</b> +${km(r.ex)} rrugë shtesë (≈${eur(r.cost)}) ${r.ok?`<span class="pill good">hyn</span>`:`<span class="pill warn">plot</span>`}`)).join("")+opt("",!rows[0].ok,false,"Mos e shto ende në udhëtim");
}

function intlNum(n){n=n.replace(/[^\d+]/g,"");if(n.startsWith("00"))n="+"+n.slice(2);else if(n.startsWith("0"))n="+383"+n.slice(1);else if(!n.startsWith("+"))n="+"+n;return n}
function contactMenu(raw,label){

  document.querySelector(".cmenu")?.remove();
  const m=document.createElement("div");m.className="cmenu";
  m.innerHTML=`<div class="cm-box"><div class="mute" style="text-align:center;margin-bottom:8px">${esc(label||n)}</div>
    <a class="cm-btn" href="tel:${n}">📞 Telefono</a>
    <a class="cm-btn" style="background:#25d366;color:#fff" href="https://wa.me/${d}" target="_blank" rel="noopener">WhatsApp</a>
    <a class="cm-btn" style="background:#7360f2;color:#fff" href="viber://chat?number=%2B${d}">Viber</a>
    <button class="cm-btn" style="background:var(--line)" type="button">Anulo</button></div>`;
  m.onclick=e=>{if(e.target===m||e.target.tagName==="BUTTON"||e.target.tagName==="A")setTimeout(()=>m.remove(),50)};
  document.body.appendChild(m);
}

    +S().vans.map(v=>`<option value="new:${v.id}">+ Udhëtim i ri me ${esc(v.name)}</option>`).join("");

function assignOrder(oid,val){
  const o=DB.orders.find(x=>x.id===oid);if(!o)return;
  if(val.startsWith("new:")){const tr={id:uid(),date:new Date(Date.now()+864e5).toISOString().slice(0,10),name:"",van:val.slice(4),orderIds:[],carIds:[],status:"planned",returnIncome:0};DB.trips.unshift(tr);val=tr.id;toast("U krijua udhëtim i ri për nesër. Ndrysho datën te Udhëtimet.")}
  DB.trips.forEach(t=>t.orderIds=t.orderIds.filter(x=>x!==oid));
  if(val){DB.trips.find(t=>t.id===val).orderIds.push(oid);o.tripId=val}else o.tripId=null;
  save();
}

function onTrip(o){const t=o.tripId&&DB.trips.find(x=>x.id===o.tripId);return !!t&&t.status!=="done"}
// "Rekomandohet": për çdo porosi që pret, udhëtimi i ardhshëm ku hyn me më pak rrugë shtesë (dhe ka vend)
async function recommendOrders(waiting){
  if(!waiting.length)return;
  const s=S(),trips=DB.trips.filter(t=>t.status!=="done"&&!isPast(t)).sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))).slice(0,3);
  const best={};
  for(const t of trips){
    const v=vanById(t.van),os=t.orderIds.map(id=>DB.orders.find(o=>o.id===id)).filter(Boolean);
    const pts=[t.start||s.base,...os.map(o=>o.addr),t.dest||s.base].filter(a=>a&&a.lat),n=pts.length;
    const M=await distMatrix([...pts,...waiting.map(o=>o.addr)]);
    let len=0;for(let i=1;i<n;i++)len+=M[i-1][i];
    const lim=Math.max(60,len*0.15),kg=os.reduce((a,o)=>a+orderGoods(o).kg,0),m3=os.reduce((a,o)=>a+orderGoods(o).m3,0);
    waiting.forEach((o,k)=>{const j=n+k,g=orderGoods(o);let ex=1e9;
      for(let a=0;a<n;a++)for(let b=0;b<n;b++)if(a!==b)ex=Math.min(ex,M[a][j]+M[j][b]-M[a][b]);
      if(ex<=lim&&kg+g.kg<=v.payloadKg&&m3+g.m3<=vanVol(v)&&(!best[o.id]||ex<best[o.id].ex))best[o.id]={t,ex}});
  }
  if(TAB!=="orders"||VIEW)return;
  waiting.forEach(o=>{const el=$("#rec-"+o.id),b=best[o.id];if(!el)return;
    el.innerHTML=b?` <span class="pill good">rekomandohet → ${esc(tripLabel(b.t.id))} (+${km(b.ex)})</span> <button class="btn small" type="button" data-recadd="${o.id}" data-trip="${b.t.id}">Shto</button>`
      :trips.length?` <span class="pill">s'ka vend ose është larg rrugës së udhëtimeve</span>`:` <span class="pill good">rekomandohet për udhëtimin e radhës</span>`});
  document.querySelectorAll("[data-recadd]").forEach(btn=>btn.onclick=()=>{assignOrder(btn.dataset.recadd,btn.dataset.trip);toast("U shtua në udhëtim");render()});
}
// Plani automatik: radha më e mirë e dorëzimit + radha e ngarkimit (e fundit ngarkohet e para)
async function renderPlan(waiting){
  const s=S(),M=await distMatrix([s.base,...waiting.map(o=>o.addr)]),best=bestOrder(M);
  const route=best.order.map(i=>waiting[i-1]);
  const v=S().vans.reduce((a,b)=>vanVol(b)>vanVol(a)?b:a);
  let kg=0,m3=0;const take=[],later=[];
  for(const o of route){const g=orderGoods(o);if(kg+g.kg<=v.payloadKg&&m3+g.m3<=vanVol(v)){take.push(o);kg+=g.kg;m3+=g.m3}else later.push(o)}
  const legs=[];let prev=0;for(const i of best.order){legs.push(M[prev][i]);prev=i}
  if(TAB!=="orders"||VIEW||!$("#plan"))return;
  $("#plan").innerHTML=`<h2>Plani për porositë që presin</h2>
    <p class="mute">${take.length} porosi · ${Math.round(kg)} kg · ${num1(m3)} m³ · ${km(best.len)} vajtje-ardhje${M.real?"":" (përafërsisht)"}</p>
    <h3>1. Radha e dorëzimit</h3>
    ${take.map((o,i)=>`<div class="stop" style="cursor:default"><div class="num">${i+1}</div><div class="grow"><b>${esc(cityOf(o.addr))}</b> · ${esc(o.customer||"")}<br><span class="mute">${esc(o.items?itemsSummary(o.items):o.what||"")} · +${km(legs[route.indexOf(o)])}</span></div><a class="btn ghost small" href="${navUrl(o.addr)}" target="_blank" rel="noopener">Harta</a></div>`).join("")}
    <h3>2. Radha e ngarkimit në Kosovë</h3>
    <p class="mute" style="margin:0 0 6px">Ngarko së pari atë që dorëzohet e fundit (në fund të rimorkios), kështu e para del e para.</p>
    <ol style="margin:0;padding-left:20px;font-size:14px">${[...take].reverse().map(o=>`<li><b>${esc(o.customer||"")}</b> (${esc(cityOf(o.addr))}): ${esc(o.items?itemsSummary(o.items):o.what||"")}</li>`).join("")}</ol>
    ${later.length?`<p><span class="pill warn">Nuk hyjnë në një furgon: ${later.map(o=>esc(cityOf(o.addr))).join(", ")}. Lëri për udhëtimin tjetër.</span></p>`:""}
    <button class="btn full" id="mkTrip">Krijo udhëtim me këto ${take.length} porosi</button>`;
  $("#mkTrip").onclick=()=>{const tr={id:uid(),date:new Date(Date.now()+864e5).toISOString().slice(0,10),name:"",van:v.id,orderIds:take.map(o=>o.id),carIds:[],status:"planned",returnIncome:0};
    take.forEach(o=>o.tripId=tr.id);DB.trips.unshift(tr);save();toast("Udhëtimi u krijua. Ndrysho datën nëse duhet.");setTab("trips",tr.id)};
}

// Gjen veturën nga emri dhe viti. Kthen të dhënat ose null.
function carLookup(model,year){
  const t=" "+String(model||"").toLowerCase().replace(/[^a-z0-9äöüë\- ]/g," ").replace(/\b([a-z]{0,3}\d{3})[a-z]{1,3}\b/g,"$1").replace(/\s+/g," ")+" ";if(t.trim().length<2)return null;
  const y=+year||+((String(model).match(/\b(19[89]\d|20[0-3]\d)\b/)||[])[1])||0;
  let best=null,bs=0;
  for(const c of CARSPECS){let sc=0;for(const a of c.a)if(t.includes(" "+a+" "))sc=Math.max(sc,a.length+(/\d|[ivx]$/.test(a)&&a.includes(" ")||/^[a-z]\d+$/.test(a)&&a.length>2?20:0));
    if(!sc)continue;if(y)sc+=y>=c.y1&&y<=c.y2?50:-Math.min(40,Math.min(Math.abs(y-c.y1),Math.abs(y-c.y2)));
    if(sc>bs){bs=sc;best=c}}
  return best;
}
// A hyn vetura në rimorkio të furgonit (gjatësi, gjerësi, peshë)?
function carFit(c,v){
  if(!c||!c.l)return {ok:true,txt:""};
  const L=v.trailer.l*100,W=v.trailer.w*100;const bad=[];
  if(c.l>L)bad.push("e gjatë "+num1(c.l/100)+" m > "+num1(v.trailer.l)+" m");
  if(c.w>W)bad.push("e gjerë");
  if(c.h&&c.h>v.trailer.h*100)bad.push("e lartë");
  if(c.kg&&c.kg>v.payloadKg)bad.push("e rëndë");
  return {ok:!bad.length,txt:bad.length?"Nuk hyn në "+v.name+": "+bad.join(", "):"Hyn në rimorkion e "+v.name};
}
// Çmimi i veturës në kthim: bazë + €/km × km (nga marrja deri në Kosovë), +% për vetura të rënda, minimumi, rrumbullakuar lart në 5 €
async function carQuote(c){ // c.vatOn, c.docs
  const s=S();if(!c.from)return null;
  const M=await distMatrix([c.from,s.base]);const kmH=M[0][1];
  let p=s.carBase+s.carPerKm*kmH,heavy=false;
  if(+c.kg>s.carHeavyKg){p*=1+s.carHeavyPct/100;heavy=true}
  const vr=c.vatOn===false?0:vatR(),docs=+c.docs||0;
  const net=Math.max(s.carMin,p)+docs,price=Math.ceil(net*(1+vr)/5)*5;
  const cost=kmH*perKm(avgVan())*0.5+s.handling+docs;  // gjysma e kostos së kthimit (rruga bëhet gjithsesi) + ngarkimi
  return {km:kmH,price,net:price/(1+vr),docs,vatOn:vr>0,heavy,cost,real:M.real};
}
function carDims(c){return c&&c.l?`${num1(c.l/100)} × ${num1(c.w/100)} × ${num1(c.h/100)} m · ${(+c.kg||0).toLocaleString("de-DE")} kg`:""}

// Porositë që presin, renditur sipas kostos shtesë për rrugën nisje → destinacion
async function renderPick(){
  const box=$("#pickBox");if(!box)return;
  const waiting=waitingOrders(null);
  if(!waiting.length){box.innerHTML=`<p class="mute">S'ka porosi që presin. Shtoji te Çmimi dhe pastaj zgjidhi këtu.</p>`;return}
  const dest=ntf.dest||ntf.start;
  const v=vanById(ntf.van),pk=perKm(v);
  const M=await distMatrix([ntf.start,dest,...waiting.map(o=>o.addr)]);
  if(TAB!=="trips"||VIEW||!$("#pickBox"))return;
  const direct=M[0][1];
  const rows=waiting.map((o,i)=>{const ex=Math.max(0,M[0][i+2]+M[i+2][1]-direct);return {o,ex,cost:ex*pk,g:orderGoods(o)}}).sort((a,b)=>a.cost-b.cost);
  const lim=Math.max(60,direct*0.15);
  let kg=0,m3=0;rows.forEach(r=>{r.rec=!!ntf.dest&&!r.o.tripId&&r.ex<=lim&&kg+r.g.kg<=v.payloadKg&&m3+r.g.m3<=vanVol(v);if(r.rec){kg+=r.g.kg;m3+=r.g.m3}});
  if(!newTripSel)newTripSel=new Set();
  if(ntf.dest&&!ntf._recDone){rows.filter(r=>r.rec).forEach(r=>newTripSel.add(r.o.id))}
  if(ntf.dest)ntf._recDone=true;
  box.innerHTML=(ntf.dest?`<h3>Porositë që presin (${rows.length}) · ${esc(cityOf(ntf.start))} → ${esc(cityOf(ntf.dest))}, ${km(direct)}${M.real?"":" përafërsisht"}</h3>
    <p class="mute" style="margin:0 0 4px">Nga më e lira te më e shtrenjta. Të shënuarat “rekomandohet” janë afër rrugës dhe hyjnë në furgon.</p>`
    :`<h3>Porositë që presin (${rows.length})</h3><p class="mute" style="margin:0 0 4px">Shëno ato që do i marrësh. Zgjidh destinacionin (3) dhe i rendis nga më e lira, me rekomandime.</p>`)+`
    ${rows.map(r=>`<label style="display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-weight:500;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);margin:0">
      <input type="checkbox" data-pick="${r.o.id}" ${newTripSel.has(r.o.id)?"checked":""} style="width:auto;margin-top:3px">
      <span style="flex:1"><b>${esc(cityOf(r.o.addr))}</b> · ${esc(r.o.customer||"")} ${r.rec?`<span class="pill good">rekomandohet</span>`:""}${r.o.tripId?` <span class="pill">tani në: ${esc(tripLabel(r.o.tripId))}</span>`:""}<br>
      <span class="mute">${esc(r.o.items?itemsSummary(r.o.items):r.o.what||"")} · ${r.g.est?"≈":""}${r.g.kg} kg · ${num1(r.g.m3)} m³</span><br>
      <span class="mute">${ntf.dest?`+${km(r.ex)} rrugë shtesë ≈ <b>${eur(r.cost)}</b> kosto · `:""}çmimi ${eur(r.o.price)}</span></span></label>`).join("")}
    <div class="totals" id="pickTot"></div>`;
  const tot=()=>{const os=rows.filter(r=>newTripSel.has(r.o.id));const k=os.reduce((a,r)=>a+r.g.kg,0),m=os.reduce((a,r)=>a+r.g.m3,0);
    $("#pickTot").innerHTML=`<div><b>${os.length}</b><span>Porosi</span></div><div><b style="${k>v.payloadKg?"color:var(--warn)":""}">${Math.round(k)} kg</b><span>nga ${v.payloadKg}</span></div><div><b style="${m>vanVol(v)?"color:var(--warn)":""}">${num1(m)} m³</b><span>nga ${num1(vanVol(v))}</span></div>`};
  box.querySelectorAll("[data-pick]").forEach(c=>c.onchange=()=>{c.checked?newTripSel.add(c.dataset.pick):newTripSel.delete(c.dataset.pick);tot();renderCarPick()});
  tot();renderCarPick();
}
// Veturat që presin të kthehen në shtëpi, renditur sipas kostos shtesë në kthim
function waitingCars(exceptTrip){
  return DB.cars.filter(c=>{if(c.status==="home"||c.tripId===exceptTrip)return false;const t=c.tripId&&DB.trips.find(x=>x.id===c.tripId);return !t||t.status==="done"});
}
async function rankCars(trip,cars,v){
  const pk=perKm(v),orders=trip.orderIds.map(id=>DB.orders.find(o=>o.id===id)).filter(Boolean);
  const base=await routeOf(trip,orders,tripCars(trip).filter(c=>!cars.includes(c)));
  const rows=[];for(const c of cars){const ex=Math.max(0,(await routeOf(trip,orders,[...tripCars(trip).filter(x=>!cars.includes(x)),c])).len-base.len);rows.push({c,ex,cost:ex*pk,net:netRec(c)-(+c.docs||0)-ex*pk})}
  return rows.sort((a,b)=>b.net-a.net);
}

  $("#app").innerHTML=`<div class="card"><h2>Çmimi dhe fitimi</h2>
    <div class="row">${num("margin","Fitimi %")}${num("minPrice","Çmimi minimal €")}</div>

    <div class="row">${num("returnShare","% e kostos që e paguajnë veturat në kthim")}${num("densityKgM3","Pesha e vlerësuar kg për m³")}</div>
    <div class="row">${num("carsPerTrip","Vetura në kthim për udhëtim")}${num("vat","TVSH %")}</div>
    <p class="mute">“Furgoni zakonisht plot” e ndan koston: në 80%, një porosi që zë 10% të furgonit paguan 12,5% të udhëtimit. “Pesha e vlerësuar” përdoret kur pesha nuk dihet.</p></div></div>
  <div class="card"><h2>🚗 Çmimi i veturave në kthim</h2>
    <div class="row">${num("carBase","Bazë €")}${num("carPerKm","€ për km deri në Kosovë")}</div>
    <div class="row">${num("carHeavyKg","Veturë e rëndë mbi kg")}${num("carHeavyPct","Shtesë për të rëndat %")}</div>
    <div class="row">${num("carMin","Çmimi minimal €")}${num("carDocs","Dokumente për veturë € (fillestare)")}</div>
    <p class="mute">Shembull: Dortmund → Prishtinë ≈ 1.900 km → 150 + 1.900 × 0,25 = 625 €. Çmimi mund të ndryshohet me dorë te çdo veturë.</p>
  <div class="card"><h2>Nafta (€/L)</h2>
    <div class="row">${["XK","RS","HR","SI"].map(c=>num("diesel."+c,c)).join("")}</div>
    <div class="row">${["AT","DE","HU"].map(c=>num("diesel."+c,c)).join("")}</div>
    <div class="row">${num("fuelHomeShare","% e blerë në Kosovë")}<div><label>Pjesa tjetër në</label><select data-path="fuelAwayCountry">${Object.keys(s.diesel).map(c=>`<option ${c===s.fuelAwayCountry?"selected":""}>${c}</option>`).join("")}</select></div></div>
    <p class="mute">Çmimi që përdoret tani: <b>${eur(dieselPrice())}</b> për litër.</p>
    <label style="display:flex;gap:6px;align-items:center;color:var(--ink);font-weight:600"><input type="checkbox" id="d-auto" style="width:auto" ${s.dieselAuto!==false?"checked":""}>Përditëso çmimet vetë çdo javë</label>
    <p class="mute" style="margin:4px 0 8px">${s.dieselUpdated?`Përditësuar së fundi: ${esc(s.dieselUpdated)}.`:"Ende pa përditësim automatik."} Austria${s.dieselStations?.DE?" dhe Gjermania":""}: pika reale më e lirë në rrugë. Kosova: mesatarja e kompanive (naftasot). Serbia: çmimi maksimal i shtetit. Të tjerat: mesatarja e BE-së.</p>
    ${Object.entries(s.dieselStations||{}).map(([c,l])=>`<h3>Pikat më të lira · ${c}</h3>${l.slice(0,4).map(x=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px"><span><b>${esc(x.name)}</b><br><span class="mute">${esc(x.address||"")}, ${esc(x.city||"")} (afër ${esc(x.near)})</span></span><b>${eur(x.price)}</b></div>`).join("")}`).join("")}
    <button class="btn ghost small" id="d-sync" type="button">Kontrollo tani</button></div>
  <div class="card"><h2>Shpenzimet e udhëtimit</h2>
    <div class="row">${num("daysPerTrip","Ditë për udhëtim")}${num("tripsPerYear","Udhëtime në vit (për furgon)")}</div>
    <div class="row">${num("driversPerVan","Shoferë për furgon")}${num("driverPerDay","Shoferi € në ditë")}</div>
    ${num("wearPerKm","Konsumimi & servisi € për km")}
    ${list("tollsPerTrip",s.tollsPerTrip,"Autostradat për udhëtim (vajtje-ardhje)")}
    ${list("fixedYear",s.fixedYear,"Shpenzime fikse në vit për furgon")}
    <p class="mute">Shpenzimet fikse për udhëtim: <b>${eur(fixedPerTrip())}</b></p></div>
  ${s.vans.map((v,i)=>`<div class="card"><h2>${esc(v.name)}</h2>
    <label>Emri</label><input data-path="vans.${i}.name" value="${esc(v.name)}">
    <div class="row">${num(`vans.${i}.totalKg`,"Pesha max totale kg (furgon + rimorkio + ngarkesa)")}${num(`vans.${i}.emptyKg`,"Pesha bosh: Sprinter + rimorkio kg")}</div>
    <div class="row">${num(`vans.${i}.lPer100`,"Litra / 100 km")}<div><label>Ngarkesa që mbetet</label><input value="${v.payloadKg} kg" disabled></div></div>
    <label>Furgoni gjerësi × gjatësi × lartësi (m)</label><div class="row">${["w","l","h"].map(k=>`<input type="number" inputmode="decimal" data-path="vans.${i}.cargo.${k}" value="${v.cargo[k]}">`).join("")}</div>
    <label>Rimorkioja gjerësi × gjatësi × lartësi (m)</label><div class="row">${["w","l","h"].map(k=>`<input type="number" inputmode="decimal" data-path="vans.${i}.trailer.${k}" value="${v.trailer[k]}">`).join("")}</div>
    <p class="mute">Hapësira totale ${num1(vanVol(v))} m³ · kostoja për km tani ${eur(perKm(v))}</p></div>`).join("")}
  <div class="card"><h2>Llojet e mallrave</h2><p class="mute">Masat në cm dhe pesha për copë. Këto i sheh edhe klienti.</p>
    ${s.presets.map((p,i)=>`<div class="item"><input data-preset="${i}" data-k="name" value="${esc(p.name)}"><div class="dims">${["l","w","h","kg","rate"].map(k=>`<input type="number" inputmode="decimal" data-preset="${i}" data-k="${k}" value="${p[k]||0}" aria-label="${k}">`).join("")}</div></div>`).join("")}
    <p class="mute">Radha: gjatësi, gjerësi, lartësi (cm), kg, çmim fiks € për copë/metër (0 = llogaritet nga hapësira dhe pesha). Fshi emrin për ta hequr.</p>
    <button class="btn ghost small" id="addPreset">+ Shto lloj</button></div>
  <div class="card"><h2>Vendet</h2><label>Nisja / shtëpia</label>${addrField("f-base",s.base)}<label>Qyteti kryesor në Gjermani (për oferta të shpejta)</label>${addrField("f-hub",s.hub)}
    <label>Linku i Instagramit</label><input data-path="instagram" value="${esc(s.instagram)}"></div>
  <div class="card"><h2>Kopje rezervë</h2><p class="mute">Të gjitha të dhënat ruhen në këtë telefon. Bëj kopje rezervë herë pas here.</p>
    <div class="row"><button class="btn ghost" id="exp">Shkarko kopjen</button><label class="btn ghost" style="margin:0;color:var(--acc);font-size:15px">Rikthe<input type="file" id="imp" accept=".json" hidden></label></div>
    <button class="btn warn full" id="reset">Kthe cilësimet në fillestare</button></div>`;
  document.querySelectorAll("[data-path]").forEach(el=>el.addEventListener("change",()=>{
    const ks=el.dataset.path.split(".");let o=s;ks.slice(0,-1).forEach(k=>o=o[k]);
    o[ks.at(-1)]=el.type==="number"?(parseFloat(el.value)||0):el.value;fixPayload();save();render()}));
  document.querySelectorAll("[data-list]").forEach(el=>el.addEventListener("change",()=>{
    const arr=s[el.dataset.list],r=arr[+el.dataset.i];r[el.dataset.k]=el.dataset.k==="eur"?(parseFloat(el.value)||0):el.value;
    if(el.dataset.k==="name"&&!el.value.trim())arr.splice(+el.dataset.i,1);save();render()}));
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{s[b.dataset.add].push({name:"I ri",eur:0});save();render()});
  document.querySelectorAll("[data-preset]").forEach(el=>el.addEventListener("change",()=>{
    const i=+el.dataset.preset,k=el.dataset.k;
    if(k==="name"&&!el.value.trim()){s.presets.splice(i,1)}else s.presets[i][k]=k==="name"?el.value:(parseFloat(el.value)||0);save();render()}));
  $("#d-auto").onchange=e=>{s.dieselAuto=e.target.checked;save();if(e.target.checked)syncPrices(true)};
  $("#d-sync").onclick=()=>syncPrices(true);
  $("#addPreset").onclick=()=>{s.presets.push({name:"Lloj i ri",l:100,w:50,h:50,kg:20,rate:0});save();render()};
  wireAddr("f-base",r=>{if(r){s.base=r;save()}});wireAddr("f-hub",r=>{if(r){s.hub=r;save()}});
  $("#exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}));a.download="gemini-kopje-"+new Date().toISOString().slice(0,10)+".json";a.click()};
  $("#imp").onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!d.orders)throw 0;DB=d;save();render();toast("Kopja u rikthye")}catch(x){toast("Skedari nuk është kopje e vlefshme")}};
  $("#reset").onclick=()=>{if(twoTap($("#reset"))){DB.settings=structuredClone(DEFAULTS);fixPayload();save();render();toast("Cilësimet u kthyen")}};
}

/* ===================== PASTRIMI I SHEMBUJVE (një herë) ===================== */
if(!DB.examplesCleaned){
  const fake=new Set(DB.orders.filter(o=>/^SHEMBULL/i.test(o.customer||"")).map(o=>o.id));
  DB.orders=DB.orders.filter(o=>!fake.has(o.id));
  DB.cars=(DB.cars||[]).filter(c=>!/SHEMBULL/i.test((c.owner||"")+" "+(c.model||"")));
  DB.trips=DB.trips.filter(t=>t.name!=="SHEMBULL");
  DB.trips.forEach(t=>{t.orderIds=t.orderIds.filter(id=>!fake.has(id));t.carIds=(t.carIds||[]).filter(id=>DB.cars.some(c=>c.id===id))});
  DB.orders.forEach(o=>{if(o.tripId&&!DB.trips.some(t=>t.id===o.tripId))o.tripId=null});
  DB.cars.forEach(c=>{if(c.tripId&&!DB.trips.some(t=>t.id===c.tripId))c.tripId=null});
  DB.examplesCleaned=true;DB.examplesShown=true;save();
}

/* ===================== NISJA ===================== */
function render(){
  const client=location.hash==="#klient";
  document.body.classList.toggle("client",client);
  $("#nav").hidden=client;
  if(client){$("#sub").textContent="";return renderClient()}
  renderNav();$("#sub").textContent=DB.orders.filter(o=>o.status!=="delivered").length+" porosi të hapura";
  ({quote:renderQuote,orders:renderOrders,trips:renderTrips,client:renderClient,settings:renderSettings})[TAB]();
}
window.addEventListener("hashchange",render);
render();
// Çmimet e naftës përditësohen vetë çdo javë (GitHub: phishalili/gemini-logistics → prices.json)
const PRICES_URL="https://phishalili.github.io/gemini-logistics/prices.json";
async function syncPrices(manual){
  const s=S();if(!manual&&s.dieselAuto===false)return;
  try{const r=await fetch(PRICES_URL+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();
    s.dieselChecked=new Date().toISOString().slice(0,10);if(j.stations)s.dieselStations=j.stations;if(Array.isArray(j.route))s.routeStations=j.route;
    const ch=Object.entries(j.diesel||{}).filter(([k,v])=>+v>0.5&&+v<4&&+s.diesel[k]!==+v);
    const was=s.dieselUpdated;s.dieselUpdated=j.updated||s.dieselChecked;
    if(ch.length){ch.forEach(([k,v])=>s.diesel[k]=+v);save();toast("Çmimet e naftës u përditësuan ("+fmtDay(s.dieselUpdated)+")");render()}
    else{save();if(manual)toast("Çmimet e naftës janë të fundit");if(manual||was!==s.dieselUpdated)refreshFuelBar()}
  }catch(e){if(manual)toast("Nuk ka internet. Çmimet mbeten si ishin.");refreshFuelBar()}
}
function fmtDay(d){const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(d||"");return m?`${m[3]}.${m[2]}.${m[1]}`:(d||"")}
function fuelBarInner(){const s=S(),on=navigator.onLine!==false;
  return `<div style="flex:1;min-width:0"><div>⛽ Nafta sot: <b>${eur(dieselPrice())}</b>/L</div><div class="mute" style="font-size:.85em">${s.dieselUpdated?"Përditësuar "+esc(fmtDay(s.dieselUpdated)):"Pa përditësim ende"}${on?"":" · pa internet"}</div></div><button class="btn ghost small" type="button" id="fuel-sync" aria-label="Kontrollo çmimet">↻</button>`}
function fuelBar(){return `<div class="card" id="fuelbar" style="display:flex;gap:10px;align-items:center;padding:10px 14px">${fuelBarInner()}</div>`}
function wireFuelBar(){const b=$("#fuel-sync");if(b)b.onclick=()=>syncPrices(true)}
function refreshFuelBar(){const el=$("#fuelbar");if(el){el.innerHTML=fuelBarInner();wireFuelBar()}}
syncPrices(false);
addEventListener("online",()=>{refreshFuelBar();syncPrices(false)});addEventListener("offline",refreshFuelBar);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S().dieselChecked!==new Date().toISOString().slice(0,10))syncPrices(false)});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
